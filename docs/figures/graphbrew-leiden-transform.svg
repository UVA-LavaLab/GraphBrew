<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc" fill="#27313A">
  <title id="title">Leiden community-detection transformation</title>
  <desc id="desc">The same graph is shown before and after Leiden community detection. Vertex IDs and edges remain unchanged; community membership is added.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="9" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 Z" fill="#1769C2"/>
    </marker>
    <style>
      :root{color-scheme:light dark}
      @media(prefers-color-scheme:dark){
        [fill="#27313A"]{fill:#ECE7DD}[stroke="#27313A"]{stroke:#ECE7DD}
        [fill="#FFFFFF"]{fill:#1E2327}
        [fill="#F8F6EC"]{fill:#252A2E}[fill="#EDF5FF"]{fill:#273846}
        [fill="#E7F7EA"]{fill:#24382A}[fill="#FFF0D8"]{fill:#3B3122}
        [fill="#F7DEDC"]{fill:#3D292A}[fill="#EEE9FF"]{fill:#302C3C}
        [stroke="#9AA3AD"]{stroke:#747D86}
      }
      .sans{font-family:Arial,Helvetica,sans-serif}
      .title{font-size:44px;font-weight:700}.subtitle{font-size:24px}
      .domain{font-size:21px;font-weight:700;letter-spacing:1.3px}
      .heading{font-size:31px;font-weight:700}.body{font-size:24px}
      .label{font-size:22px;font-weight:700}
      .edge{stroke:#747D86;stroke-width:3.5}
      .node{stroke:#27313A;stroke-width:2.5}
      .flow{fill:none;stroke:#1769C2;stroke-width:3;marker-end:url(#arrow)}
      .graph-panel{stroke:#9AA3AD;stroke-width:2}
    </style>
  </defs>
  <rect width="1400" height="650" fill="#FFFFFF"/>

  <text x="45" y="55" class="sans title">1. Leiden: graph structure -&gt; community membership</text>
  <text x="45" y="88" class="sans subtitle">The partitioner assigns groups; it does not relabel vertices yet.</text>
  <line x1="45" y1="112" x2="1355" y2="112" stroke="#27313A" stroke-width="2"/>

  <rect x="35" y="135" width="1330" height="480" rx="12" fill="none" stroke="#9AA3AD" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="52" y="162" class="sans domain">PARTITIONER TRANSFORMATION</text>
  <text x="350" y="195" text-anchor="middle" class="sans heading">Input graph</text>
  <text x="1050" y="195" text-anchor="middle" class="sans heading">Detected communities</text>
  <rect x="95" y="205" width="520" height="310" rx="12" fill="#F8F6EC" class="graph-panel"/>
  <rect x="795" y="205" width="530" height="310" rx="12" fill="#EDF5FF" class="graph-panel"/>

  <g transform="translate(0 40)">
  <g class="edge">
    <line x1="170" y1="300" x2="250" y2="235"/><line x1="170" y1="300" x2="250" y2="385"/>
    <line x1="250" y1="235" x2="330" y2="305"/><line x1="250" y1="385" x2="330" y2="305"/>
    <line x1="330" y1="305" x2="430" y2="240"/><line x1="330" y1="305" x2="500" y2="315"/>
    <line x1="430" y1="240" x2="500" y2="315"/><line x1="500" y1="315" x2="440" y2="410"/>
    <line x1="500" y1="315" x2="575" y2="400"/><line x1="440" y1="410" x2="575" y2="400"/>

    <line x1="870" y1="300" x2="950" y2="235"/><line x1="870" y1="300" x2="950" y2="385"/>
    <line x1="950" y1="235" x2="1030" y2="305"/><line x1="950" y1="385" x2="1030" y2="305"/>
    <line x1="1030" y1="305" x2="1130" y2="240"/><line x1="1030" y1="305" x2="1200" y2="315"/>
    <line x1="1130" y1="240" x2="1200" y2="315"/><line x1="1200" y1="315" x2="1140" y2="410"/>
    <line x1="1200" y1="315" x2="1275" y2="400"/><line x1="1140" y1="410" x2="1275" y2="400"/>
  </g>

  <g class="sans body" text-anchor="middle">
    <circle cx="170" cy="300" r="28" fill="#F8F6EC" class="node"/><text x="170" y="307">0</text>
    <circle cx="250" cy="235" r="28" fill="#F8F6EC" class="node"/><text x="250" y="242">1</text>
    <circle cx="250" cy="385" r="28" fill="#F8F6EC" class="node"/><text x="250" y="392">2</text>
    <circle cx="330" cy="305" r="28" fill="#F8F6EC" class="node"/><text x="330" y="312">3</text>
    <circle cx="430" cy="240" r="28" fill="#F8F6EC" class="node"/><text x="430" y="247">4</text>
    <circle cx="500" cy="315" r="28" fill="#F8F6EC" class="node"/><text x="500" y="322">5</text>
    <circle cx="440" cy="410" r="28" fill="#F8F6EC" class="node"/><text x="440" y="417">6</text>
    <circle cx="575" cy="400" r="28" fill="#F8F6EC" class="node"/><text x="575" y="407">7</text>
  </g>

  <path d="M620 330 H780" class="flow"/>
  <rect x="650" y="300" width="100" height="42" rx="7" fill="#F8F6EC"/>
  <text x="700" y="329" text-anchor="middle" class="sans label">Leiden</text>

  <circle cx="935" cy="310" r="110" fill="none" stroke="#C58A28" stroke-width="3" stroke-dasharray="6 7"/>
  <circle cx="1210" cy="320" r="115" fill="none" stroke="#1769C2" stroke-width="3" stroke-dasharray="6 7"/>
  <g class="sans body" text-anchor="middle">
    <circle cx="870" cy="300" r="28" fill="#FFF0D8" class="node"/><text x="870" y="307">0</text>
    <circle cx="950" cy="235" r="28" fill="#FFF0D8" class="node"/><text x="950" y="242">1</text>
    <circle cx="950" cy="385" r="28" fill="#FFF0D8" class="node"/><text x="950" y="392">2</text>
    <circle cx="1030" cy="305" r="30" fill="#F7DEDC" class="node"/><text x="1030" y="312">3</text>
    <circle cx="1130" cy="240" r="28" fill="#EDF5FF" class="node"/><text x="1130" y="247">4</text>
    <circle cx="1200" cy="315" r="30" fill="#E7F7EA" class="node"/><text x="1200" y="322">5</text>
    <circle cx="1140" cy="410" r="28" fill="#EDF5FF" class="node"/><text x="1140" y="417">6</text>
    <circle cx="1275" cy="400" r="28" fill="#EDF5FF" class="node"/><text x="1275" y="407">7</text>
  </g>
  </g>

  <rect x="285" y="535" width="830" height="48" rx="8" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="700" y="567" text-anchor="middle" class="sans body">Edges and vertex IDs are unchanged; only membership C(v) is added.</text>
</svg>
