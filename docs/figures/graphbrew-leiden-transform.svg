<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc" fill="#27313A" data-figure-schema="graphbrew-public/v3">
  <title id="title">Stage 2: partition the same graph into C0 and C1</title>
  <desc id="desc">The example manually freezes one pedagogical membership so every later layout and CSR value can be checked exactly.</desc>
