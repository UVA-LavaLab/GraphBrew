<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc" fill="#27313A">
  <title id="title">Stage 2: partition the same graph into C0 and C1</title>
  <desc id="desc">The example manually freezes one pedagogical membership so every later layout and CSR value can be checked exactly.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 Z" fill="#1769C2"/>
    </marker>
    <style>
      :root{color-scheme:light dark}
      @media(prefers-color-scheme:dark){
        [fill="#27313A"]{fill:#ECE7DD}[stroke="#27313A"]{stroke:#ECE7DD}
        [fill="#FFFFFF"]{fill:#1E2327}[fill="#F8F6EC"]{fill:#252A2E}
        [fill="#EDF5FF"]{fill:#273846}[fill="#E7F7EA"]{fill:#24382A}
        [fill="#FFF0D8"]{fill:#3B3122}[fill="#F7DEDC"]{fill:#3D292A}
        [fill="#EEE9FF"]{fill:#302C3C}[stroke="#9AA3AD"]{stroke:#747D86}
        [stroke="#1769C2"]{stroke:#63A8FF}[fill="#1769C2"]{fill:#63A8FF}
        .arrow{stroke:#63A8FF!important}.edge{stroke:#ECE7DD!important}
      }
      .sans{font-family:Arial,Helvetica,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,monospace}
      .title{font-size:32px;font-weight:700}.subtitle{font-size:18px}
      .domain{font-size:16px;font-weight:700;letter-spacing:1.2px}.heading{font-size:22px;font-weight:700}
      .label{font-size:18px;font-weight:700}.body{font-size:17px}.small{font-size:16px}
      .arrow{fill:none;stroke:#1769C2;stroke-width:3;marker-end:url(#arrow)}
      .edge{stroke:#27313A;stroke-width:2.2}
    </style>
  </defs>
  <rect width="1200" height="590" fill="#FFFFFF"/>
  <text x="42" y="47" class="sans title">Stage 2: partition the same graph into C0 and C1</text>
  <text x="42" y="75" class="sans subtitle">This is not the detector output for the tiny graph; v2 is tracked inside C0.</text>
  <line x1="42" y1="99" x2="1158" y2="99" stroke="#27313A" stroke-width="2"/>
  <rect x="35" y="120" width="520" height="390" rx="10" fill="#EDF5FF" stroke="#27313A" stroke-width="3"/>
  <text x="60" y="155" class="sans heading">Before partition metadata</text>
  <line x1="112" y1="280" x2="170" y2="230" class="edge"/>
  <line x1="112" y1="280" x2="170" y2="331" class="edge"/>
  <line x1="170" y1="230" x2="241" y2="280" class="edge"/>
  <line x1="170" y1="331" x2="241" y2="280" class="edge"/>
  <line x1="241" y1="280" x2="311" y2="230" class="edge"/>
  <line x1="241" y1="280" x2="373" y2="280" class="edge"/>
  <line x1="311" y1="230" x2="373" y2="280" class="edge"/>
  <line x1="311" y1="230" x2="443" y2="230" class="edge"/>
  <line x1="373" y1="280" x2="338" y2="343" class="edge"/>
  <line x1="373" y1="280" x2="443" y2="331" class="edge"/>
  <line x1="338" y1="343" x2="443" y2="331" class="edge"/>
  <line x1="443" y1="331" x2="443" y2="230" class="edge"/>
  <circle cx="112" cy="280" r="20" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="112" y="285" class="sans label" text-anchor="middle">0</text>
  <circle cx="311" cy="230" r="20" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="311" y="235" class="sans label" text-anchor="middle">1</text>
  <circle cx="373" cy="280" r="23" fill="#E7F7EA" stroke="#1769C2" stroke-width="3"/>
  <text x="373" y="285" class="sans label" text-anchor="middle">2</text>
  <circle cx="170" cy="230" r="20" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="170" y="235" class="sans label" text-anchor="middle">3</text>
  <circle cx="338" cy="343" r="20" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="338" y="348" class="sans label" text-anchor="middle">4</text>
  <circle cx="170" cy="331" r="20" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="170" y="336" class="sans label" text-anchor="middle">5</text>
  <circle cx="443" cy="331" r="20" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="443" y="336" class="sans label" text-anchor="middle">6</text>
  <circle cx="443" cy="230" r="20" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="443" y="235" class="sans label" text-anchor="middle">7</text>
  <circle cx="241" cy="280" r="20" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="241" y="285" class="sans label" text-anchor="middle">8</text>
  <text x="60" y="470" class="mono small">membership = unknown</text>
  <rect x="645" y="120" width="520" height="390" rx="10" fill="#EEE9FF" stroke="#27313A" stroke-width="3"/>
  <circle cx="675" cy="150" r="17" fill="#27313A" stroke="#27313A" stroke-width="1"/>
  <text x="675" y="156" class="sans label" text-anchor="middle" fill="#FFFFFF">2</text>
  <text x="702" y="157" class="sans heading">Frozen example membership</text>
  <line x1="722" y1="280" x2="780" y2="230" class="edge"/>
  <line x1="722" y1="280" x2="780" y2="331" class="edge"/>
  <line x1="780" y1="230" x2="851" y2="280" class="edge"/>
  <line x1="780" y1="331" x2="851" y2="280" class="edge"/>
  <line x1="851" y1="280" x2="921" y2="230" class="edge"/>
  <line x1="851" y1="280" x2="983" y2="280" class="edge"/>
  <line x1="921" y1="230" x2="983" y2="280" class="edge"/>
  <line x1="921" y1="230" x2="1053" y2="230" class="edge"/>
  <line x1="983" y1="280" x2="948" y2="343" class="edge"/>
  <line x1="983" y1="280" x2="1053" y2="331" class="edge"/>
  <line x1="948" y1="343" x2="1053" y2="331" class="edge"/>
  <line x1="1053" y1="331" x2="1053" y2="230" class="edge"/>
  <circle cx="722" cy="280" r="20" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/>
  <text x="722" y="285" class="sans label" text-anchor="middle">0</text>
  <circle cx="921" cy="230" r="20" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/>
  <text x="921" y="235" class="sans label" text-anchor="middle">1</text>
  <circle cx="983" cy="280" r="23" fill="#E7F7EA" stroke="#1769C2" stroke-width="3"/>
  <text x="983" y="285" class="sans label" text-anchor="middle">2</text>
  <circle cx="780" cy="230" r="20" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/>
  <text x="780" y="235" class="sans label" text-anchor="middle">3</text>
  <circle cx="948" cy="343" r="20" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/>
  <text x="948" y="348" class="sans label" text-anchor="middle">4</text>
  <circle cx="780" cy="331" r="20" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/>
  <text x="780" y="336" class="sans label" text-anchor="middle">5</text>
  <circle cx="1053" cy="331" r="20" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/>
  <text x="1053" y="336" class="sans label" text-anchor="middle">6</text>
  <circle cx="1053" cy="230" r="20" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/>
  <text x="1053" y="235" class="sans label" text-anchor="middle">7</text>
  <circle cx="851" cy="280" r="20" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/>
  <text x="851" y="285" class="sans label" text-anchor="middle">8</text>
  <rect x="680" y="430" width="210" height="48" rx="7" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/>
  <text x="785" y="460" class="mono small" text-anchor="middle">C0 = {1,2,4,6,7}</text>
  <rect x="920" y="430" width="210" height="48" rx="7" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/>
  <text x="1025" y="460" class="mono small" text-anchor="middle">C1 = {0,3,5,8}</text>
  <path d="M555 310 H641" class="arrow"/>
  <rect x="144" y="525" width="912" height="44" rx="9" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="600" y="552" class="sans small" text-anchor="middle">Invariant: partitioning adds C(v); vertex IDs and the 12-edge topology remain unchanged.</text>
</svg>
