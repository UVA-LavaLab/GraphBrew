<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220" role="img" aria-labelledby="title desc">
  <title id="title">GraphBrew promoted-recipe cost controls</title>
  <desc id="desc">Four panels explain cd_parallel, sgmb4096, gordf5000, and norefine. Parallel community detection permits schedule-sensitive concurrent moves. Super-graph batches compute proposals in parallel and commit in order. Gorder is limited to communities of at most 5000 vertices with BFS fallback above the threshold. No-refine bypasses the Leiden refinement phase.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M0 0 L12 5 L0 10 Z" fill="#1683BD"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M0 0 L12 5 L0 10 Z" fill="#F7941D"/>
    </marker>
    <style>
      .sans{font-family:Arial,Helvetica,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,monospace}
      .title{font-size:38px;font-weight:700;fill:#17212B}
      .subtitle{font-size:18px;fill:#4B5560}
      .paneltitle{font-size:25px;font-weight:700;fill:#17212B}
      .heading{font-size:20px;font-weight:700;fill:#17212B}
      .body{font-size:16px;fill:#27313A}
      .small{font-size:14px;fill:#4B5560}
      .tiny{font-size:12px;fill:#4B5560}
      .card{fill:#FFFFFF;stroke:#AEB7BF;stroke-width:2}
      .edge{stroke:#6B7075;stroke-width:4}
      .blueflow{fill:none;stroke:#1683BD;stroke-width:4;marker-end:url(#arrow-blue)}
      .orangeflow{fill:none;stroke:#F7941D;stroke-width:4;marker-end:url(#arrow-orange)}
    </style>
  </defs>
  <rect width="1600" height="1220" fill="#FFFFFF"/>
  <text x="55" y="58" class="sans title">How the promoted recipe bounds preprocessing cost</text>
  <text x="55" y="90" class="sans subtitle">These tokens alter execution mechanics, not the three public composition axes.</text>
  <line x1="55" y1="115" x2="1545" y2="115" stroke="#17212B" stroke-width="2"/>

  <rect x="45" y="145" width="735" height="455" rx="12" class="card"/>
  <text x="75" y="185" class="sans paneltitle">A. cd_parallel</text>
  <text x="75" y="214" class="sans body">Allow Leiden local-moving work to use the configured OpenMP threads.</text>
  <text x="85" y="260" class="sans heading">cd_serial</text>
  <text x="85" y="286" class="sans small">one schedule, one move stream</text>
  <line x1="115" y1="330" x2="590" y2="330" stroke="#AEB7BF" stroke-width="3"/>
  <g class="sans small" text-anchor="middle">
    <circle cx="145" cy="330" r="23" fill="#FFE8A6" stroke="#17212B"/><text x="145" y="335">v0</text>
    <circle cx="225" cy="330" r="23" fill="#FFD870" stroke="#17212B"/><text x="225" y="335">v1</text>
    <circle cx="305" cy="330" r="23" fill="#FFC13A" stroke="#17212B"/><text x="305" y="335">v2</text>
    <circle cx="385" cy="330" r="23" fill="#B9DEF2" stroke="#17212B"/><text x="385" y="335">v3</text>
    <circle cx="465" cy="330" r="23" fill="#83C7E8" stroke="#17212B"/><text x="465" y="335">v4</text>
    <circle cx="545" cy="330" r="23" fill="#49A9D7" stroke="#17212B"/><text x="545" y="335">v5</text>
  </g>
  <path d="M145 365 H225" class="orangeflow"/>
  <path d="M305 365 H385" class="orangeflow"/>
  <path d="M465 365 H545" class="orangeflow"/>

  <text x="85" y="435" class="sans heading">cd_parallel</text>
  <text x="85" y="461" class="sans small">multiple workers; valid mapping may depend on schedule</text>
  <g class="sans small">
    <rect x="110" y="485" width="160" height="38" rx="7" fill="#FFF3DB" stroke="#F7941D"/><text x="125" y="510">T0: v0, v3</text>
    <rect x="290" y="485" width="160" height="38" rx="7" fill="#EEF6FC" stroke="#1683BD"/><text x="305" y="510">T1: v1, v4</text>
    <rect x="470" y="485" width="160" height="38" rx="7" fill="#EAF7F3" stroke="#189D85"/><text x="485" y="510">T2: v2, v5</text>
  </g>
  <text x="370" y="550" text-anchor="middle" class="sans tiny">The selector decision is deterministic; the resulting parallel mapping can vary.</text>
  <text x="370" y="574" text-anchor="middle" class="sans tiny">Record mapping fingerprints and use repeated mapping draws in final studies.</text>

  <rect x="820" y="145" width="735" height="455" rx="12" class="card"/>
  <text x="850" y="185" class="sans paneltitle">B. sgmb4096</text>
  <text x="850" y="214" class="sans body">Batch internal Leiden super-node moves; this is not the final block-order stage.</text>
  <text x="850" y="250" class="sans small">Example batch below is scaled down. The real bound is 4,096 community super-nodes.</text>
  <g transform="translate(885 290)" class="sans small" text-anchor="middle">
    <circle cx="40" cy="50" r="25" fill="#F7941D" stroke="#17212B"/><text x="40" y="55">C0</text>
    <circle cx="130" cy="20" r="25" fill="#FFC13A" stroke="#17212B"/><text x="130" y="25">C1</text>
    <circle cx="220" cy="65" r="25" fill="#FFD870" stroke="#17212B"/><text x="220" y="70">C2</text>
    <circle cx="310" cy="25" r="25" fill="#FFE8A6" stroke="#17212B"/><text x="310" y="30">C3</text>
    <circle cx="400" cy="65" r="25" fill="#1683BD" stroke="#17212B"/><text x="400" y="70">C4</text>
    <circle cx="490" cy="20" r="25" fill="#49A9D7" stroke="#17212B"/><text x="490" y="25">C5</text>
    <circle cx="580" cy="55" r="25" fill="#83C7E8" stroke="#17212B"/><text x="580" y="60">C6</text>
    <line x1="62" y1="42" x2="106" y2="27" class="edge"/>
    <line x1="153" y1="30" x2="197" y2="54" class="edge"/>
    <line x1="243" y1="54" x2="287" y2="35" class="edge"/>
    <line x1="333" y1="35" x2="377" y2="54" class="edge"/>
    <line x1="423" y1="54" x2="467" y2="30" class="edge"/>
    <line x1="513" y1="29" x2="557" y2="46" class="edge"/>
  </g>
  <rect x="870" y="395" width="645" height="60" rx="8" fill="#F8FAFB" stroke="#1683BD" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="1192" y="420" text-anchor="middle" class="sans body">parallel proposal phase</text>
  <text x="1192" y="443" text-anchor="middle" class="sans small">all proposals in the batch observe the pre-commit state</text>
  <path d="M1192 458 V485" class="blueflow"/>
  <text x="1192" y="490" text-anchor="middle" class="sans small">ordered commit by super-node ID</text>
  <g transform="translate(890 500)" class="sans small" text-anchor="middle">
    <rect x="0" y="0" width="75" height="42" fill="#F7941D" stroke="#17212B"/><text x="37" y="27">C0</text>
    <rect x="75" y="0" width="75" height="42" fill="#FFC13A" stroke="#17212B"/><text x="112" y="27">C1</text>
    <rect x="150" y="0" width="75" height="42" fill="#FFD870" stroke="#17212B"/><text x="187" y="27">C2</text>
    <rect x="225" y="0" width="75" height="42" fill="#FFE8A6" stroke="#17212B"/><text x="262" y="27">C3</text>
    <rect x="300" y="0" width="75" height="42" fill="#1683BD" stroke="#17212B"/><text x="337" y="27">C4</text>
    <rect x="375" y="0" width="75" height="42" fill="#49A9D7" stroke="#17212B"/><text x="412" y="27">C5</text>
    <rect x="450" y="0" width="75" height="42" fill="#83C7E8" stroke="#17212B"/><text x="487" y="27">C6</text>
  </g>
  <text x="1510" y="575" text-anchor="end" class="sans tiny">sgmb1 preserves sequential proposal/commit semantics.</text>

  <rect x="45" y="630" width="735" height="455" rx="12" class="card"/>
  <text x="75" y="670" class="sans paneltitle">C. gordf5000</text>
  <text x="75" y="699" class="sans body">Choose the intra-community algorithm from community size, not whole-graph size.</text>

  <circle cx="240" cy="835" r="105" fill="none" stroke="#F7941D" stroke-width="6" stroke-dasharray="3 12"/>
  <text x="240" y="750" text-anchor="middle" class="sans heading">|C| &lt;= 5,000</text>
  <g transform="translate(130 800)" class="sans small" text-anchor="middle">
    <circle cx="30" cy="45" r="20" fill="#F7941D" stroke="#17212B"/><text x="30" y="50">0</text>
    <circle cx="100" cy="15" r="20" fill="#FFC13A" stroke="#17212B"/><text x="100" y="20">1</text>
    <circle cx="170" cy="55" r="20" fill="#FFD870" stroke="#17212B"/><text x="170" y="60">2</text>
    <circle cx="90" cy="100" r="20" fill="#FFE8A6" stroke="#17212B"/><text x="90" y="105">3</text>
    <line x1="48" y1="37" x2="81" y2="23" class="edge"/>
    <line x1="118" y1="25" x2="152" y2="45" class="edge"/>
    <line x1="151" y1="68" x2="108" y2="91" class="edge"/>
    <line x1="72" y1="87" x2="43" y2="59" class="edge"/>
  </g>
  <rect x="115" y="960" width="250" height="52" rx="8" fill="#FFF3DB" stroke="#F7941D" stroke-width="2"/>
  <text x="240" y="982" text-anchor="middle" class="sans body">Gorder8</text>
  <text x="240" y="1003" text-anchor="middle" class="sans tiny">sliding window of 8 placed vertices</text>

  <circle cx="565" cy="835" r="125" fill="none" stroke="#1683BD" stroke-width="6" stroke-dasharray="3 12"/>
  <text x="565" y="730" text-anchor="middle" class="sans heading">|C| &gt; 5,000</text>
  <circle cx="565" cy="835" r="22" fill="#1683BD" stroke="#17212B"/>
  <circle cx="500" cy="790" r="19" fill="#49A9D7" stroke="#17212B"/>
  <circle cx="630" cy="790" r="19" fill="#49A9D7" stroke="#17212B"/>
  <circle cx="475" cy="875" r="18" fill="#83C7E8" stroke="#17212B"/>
  <circle cx="535" cy="915" r="18" fill="#83C7E8" stroke="#17212B"/>
  <circle cx="595" cy="915" r="18" fill="#B9DEF2" stroke="#17212B"/>
  <circle cx="655" cy="875" r="18" fill="#B9DEF2" stroke="#17212B"/>
  <line x1="548" y1="821" x2="516" y2="800" class="edge"/>
  <line x1="582" y1="821" x2="614" y2="800" class="edge"/>
  <line x1="548" y1="849" x2="490" y2="867" class="edge"/>
  <line x1="556" y1="856" x2="540" y2="898" class="edge"/>
  <line x1="574" y1="856" x2="590" y2="898" class="edge"/>
  <line x1="582" y1="849" x2="640" y2="867" class="edge"/>
  <rect x="440" y="960" width="250" height="52" rx="8" fill="#EEF6FC" stroke="#1683BD" stroke-width="2"/>
  <text x="565" y="982" text-anchor="middle" class="sans body">BFS fallback</text>
  <text x="565" y="1003" text-anchor="middle" class="sans tiny">cheap hub-rooted traversal</text>
  <text x="75" y="1055" class="sans small">The threshold bounds the costly tail while retaining Gorder on small blocks.</text>

  <rect x="820" y="630" width="735" height="455" rx="12" class="card"/>
  <text x="850" y="670" class="sans paneltitle">D. norefine</text>
  <text x="850" y="699" class="sans body">Skip Leiden's constrained refinement phase before aggregation.</text>

  <rect x="865" y="745" width="260" height="110" rx="10" fill="#F8FAFB" stroke="#27313A" stroke-width="2"/>
  <text x="995" y="775" text-anchor="middle" class="sans heading">local moving</text>
  <circle cx="940" cy="815" r="23" fill="#F7941D" stroke="#17212B"/>
  <circle cx="990" cy="815" r="23" fill="#FFC13A" stroke="#17212B"/>
  <circle cx="1040" cy="815" r="23" fill="#FFD870" stroke="#17212B"/>
  <line x1="963" y1="815" x2="967" y2="815" class="edge"/>
  <line x1="1013" y1="815" x2="1017" y2="815" class="edge"/>

  <path d="M1125 800 H1200" class="orangeflow"/>
  <text x="1160" y="785" text-anchor="middle" class="sans small">norefine</text>
  <rect x="1200" y="745" width="300" height="110" rx="10" fill="#FFF3DB" stroke="#F7941D" stroke-width="3"/>
  <text x="1350" y="778" text-anchor="middle" class="sans heading">aggregate directly</text>
  <circle cx="1300" cy="815" r="28" fill="#F7941D" stroke="#17212B"/>
  <circle cx="1360" cy="815" r="28" fill="#FFC13A" stroke="#17212B"/>
  <circle cx="1420" cy="815" r="28" fill="#FFD870" stroke="#17212B"/>

  <path d="M995 855 V920" class="blueflow"/>
  <text x="1010" y="895" class="sans small">full Leiden</text>
  <rect x="865" y="925" width="420" height="105" rx="10" fill="#EEF6FC" stroke="#1683BD" stroke-width="2"/>
  <text x="1075" y="955" text-anchor="middle" class="sans heading">refine inside original bounds</text>
  <circle cx="950" cy="995" r="22" fill="#F7941D" stroke="#17212B"/>
  <circle cx="1000" cy="995" r="22" fill="#FFC13A" stroke="#17212B"/>
  <line x1="972" y1="995" x2="978" y2="995" class="edge"/>
  <circle cx="1150" cy="995" r="22" fill="#FFD870" stroke="#17212B"/>
  <line x1="1030" y1="995" x2="1115" y2="995" stroke="#AEB7BF" stroke-width="3" stroke-dasharray="8 7"/>
  <text x="1305" y="940" class="sans small">Refinement can improve</text>
  <text x="1305" y="963" class="sans small">community connectivity,</text>
  <text x="1305" y="986" class="sans small">but adds another move phase.</text>
  <text x="1305" y="1028" class="sans small">norefine trades that work for lower cost.</text>

  <rect x="45" y="1115" width="1510" height="72" rx="10" fill="#F8FAFB" stroke="#17212B" stroke-width="2"/>
  <text x="75" y="1146" class="sans heading">Related bounds:</text>
  <text x="275" y="1146" class="mono body">gw8</text>
  <text x="330" y="1146" class="sans body">uses an 8-vertex Gorder window;</text>
  <text x="665" y="1146" class="mono body">2:2</text>
  <text x="715" y="1146" class="sans body">caps local-moving iterations and aggregation passes at two.</text>
  <text x="75" y="1173" class="sans small">Changing any token creates a different experimental treatment and invalidates the frozen selector evidence for the original recipe.</text>
</svg>
