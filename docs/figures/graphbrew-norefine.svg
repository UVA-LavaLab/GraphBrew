<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc" fill="#27313A" data-figure-schema="graphbrew-public/v4">
  <title id="title">Control C: norefine removes the constrained Leiden refinement phase</title>
  <desc id="desc">Local moving and aggregation still run; the connectivity and subset-optimality guarantees no longer apply.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 Z" fill="#1769C2"/>
    </marker>
    <style>
      :root{color-scheme:light dark}
      @media(prefers-color-scheme:dark){
        [fill="#27313A"]{fill:#ECE7DD}[stroke="#27313A"]{stroke:#ECE7DD}
        [fill="#FFFFFF"]{fill:#1E2327}[fill="#F8F6EC"]{fill:#252A2E}
        [fill="#EDF5FF"]{fill:#273846}[fill="#E7F7EA"]{fill:#24382A}
        [fill="#FFF0D8"]{fill:#3B3122}[fill="#F7DEDC"]{fill:#3D292A}
        [fill="#EEE9FF"]{fill:#302C3C}[stroke="#9AA3AD"]{stroke:#747D86}
        [stroke="#1769C2"]{stroke:#63A8FF}[fill="#1769C2"]{fill:#63A8FF}
        [stroke="#B45309"]{stroke:#F0B35A}[stroke="#15803D"]{stroke:#63D68B}
        .arrow{stroke:#63A8FF!important}.edge{stroke:#ECE7DD!important}
      }
      .sans{font-family:Arial,Helvetica,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,monospace}
      .title{font-size:32px;font-weight:700}.subtitle{font-size:18px}
      .domain{font-size:16px;font-weight:700;letter-spacing:1.2px}.heading{font-size:22px;font-weight:700}
      .label{font-size:18px;font-weight:700}.body{font-size:17px}.small{font-size:16px}.micro{font-size:14px;font-weight:700}
      .arrow{fill:none;stroke:#1769C2;stroke-width:3;marker-end:url(#arrow)}
      .edge{stroke:#27313A;stroke-width:2.2}
    </style>
  </defs>
  <rect width="1200" height="500" fill="#FFFFFF"/>
  <text x="42" y="47" class="sans title">Control C: norefine removes the constrained Leiden refinement phase</text>
  <text x="42" y="75" class="sans subtitle">Same running graph and C0/C1 notation; this figure compares phase structure, not measured quality.</text>
  <line x1="42" y1="99" x2="1158" y2="99" stroke="#27313A" stroke-width="2"/>
  <rect x="25" y="112" width="1150" height="300" rx="12" fill="none" stroke="#9AA3AD" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="35" y="130" width="300" height="240" rx="10" fill="#EDF5FF" stroke="#27313A" stroke-width="3"/>
  <text x="60" y="165" class="sans heading">Local moving</text>
  <text x="60" y="202" class="sans body">Move vertices between groups.</text>
  <text x="60" y="245" class="mono body">v2 -&gt; candidate C0</text>
  <rect x="450" y="130" width="300" height="110" rx="10" fill="#FFF0D8" stroke="#27313A" stroke-width="3"/>
  <text x="475" y="165" class="sans heading">norefine path</text>
  <text x="475" y="202" class="sans body">Aggregate directly.</text>
  <rect x="450" y="285" width="300" height="110" rx="10" fill="#EEE9FF" stroke="#27313A" stroke-width="3"/>
  <text x="475" y="320" class="sans heading">full Leiden path</text>
  <text x="475" y="357" class="sans body">Refine within bounds, then aggregate.</text>
  <rect x="865" y="130" width="300" height="265" rx="10" fill="#F7DEDC" stroke="#27313A" stroke-width="3"/>
  <text x="890" y="165" class="sans heading">Behavioral consequence</text>
  <text x="890" y="205" class="sans body">norefine lowers preprocessing.</text>
  <text x="890" y="235" class="sans body">It may change the partition.</text>
  <text x="890" y="265" class="sans body">It is not equivalent to full Leiden.</text>
  <rect x="890" y="310" width="250" height="48" rx="7" fill="#FFFFFF" stroke="#27313A" stroke-width="2"/>
  <text x="1015" y="340" class="mono small" text-anchor="middle">bounded local-moving path</text>
  <path d="M335 205 H446" class="arrow"/>
  <path d="M335 300 H446" class="arrow"/>
  <path d="M750 185 H861" class="arrow"/>
  <path d="M750 340 H861" class="arrow"/>
  <rect x="144" y="430" width="912" height="44" rx="9" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="600" y="457" class="sans small" text-anchor="middle">Invariant: norefine changes community-detection semantics; vertex-layout stages still run afterward.</text>
</svg>
