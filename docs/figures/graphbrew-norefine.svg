<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc" fill="#27313A">
  <title id="title">norefine execution path</title>
  <desc id="desc">After Leiden local moving, norefine goes directly to aggregation. Full Leiden performs a constrained refinement phase before aggregation.</desc>
  <defs>
    <marker id="blue-arrow" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M0 0 L12 5 L0 10 Z" fill="#1769C2"/>
    </marker>
    <marker id="orange-arrow" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M0 0 L12 5 L0 10 Z" fill="#1769C2"/>
    </marker>
    <style>
      :root{color-scheme:light dark}
      @media(prefers-color-scheme:dark){
        [fill="#27313A"]{fill:#ECE7DD}[stroke="#27313A"]{stroke:#ECE7DD}
        [fill="#F8F6EC"]{fill:#252A2E}[fill="#EDF5FF"]{fill:#273846}
        [fill="#E7F7EA"]{fill:#24382A}[fill="#FFF0D8"]{fill:#3B3122}
        [fill="#F7DEDC"]{fill:#3D292A}[fill="#EEE9FF"]{fill:#302C3C}
        [stroke="#9AA3AD"]{stroke:#747D86}
      }
      .sans{font-family:Arial,Helvetica,sans-serif}
      .title{font-size:40px;font-weight:700}.subtitle{font-size:22px}
      .domain{font-size:20px;font-weight:700;letter-spacing:1.3px}
      .heading{font-size:28px;font-weight:700}.body{font-size:22px}
      .label{font-size:20px;font-weight:700}
      .blueflow{fill:none;stroke:#1769C2;stroke-width:5;marker-end:url(#blue-arrow)}
      .orangeflow{fill:none;stroke:#1769C2;stroke-width:5;marker-end:url(#orange-arrow)}
    </style>
  </defs>
  <text x="45" y="55" class="sans title">norefine: remove one Leiden move phase</text>
  <text x="45" y="88" class="sans subtitle">Local moving and aggregation still run; only constrained refinement is bypassed.</text>
  <line x1="45" y1="112" x2="1355" y2="112" stroke="#27313A" stroke-width="2"/>

  <rect x="35" y="140" width="1330" height="410" rx="12" fill="none" stroke="#9AA3AD" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="52" y="166" class="sans domain">LEIDEN PHASE CONTROL</text>
  <rect x="55" y="235" width="260" height="130" rx="9" fill="#F8F6EC" stroke="#27313A" stroke-width="3"/>
  <text x="185" y="280" text-anchor="middle" class="sans heading">Local moving</text>
  <circle cx="130" cy="325" r="25" fill="#F7DEDC" stroke="#27313A" stroke-width="2"/>
  <circle cx="185" cy="325" r="25" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/>
  <circle cx="240" cy="325" r="25" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/>

  <path d="M315 270 H500" class="orangeflow"/>
  <rect x="350" y="238" width="115" height="38" fill="#F8F6EC"/>
  <text x="407" y="266" text-anchor="middle" class="sans label">norefine</text>
  <rect x="500" y="180" width="360" height="145" rx="9" fill="#FFF0D8" stroke="#27313A" stroke-width="3"/>
  <text x="680" y="228" text-anchor="middle" class="sans heading">Aggregate directly</text>
  <text x="680" y="270" text-anchor="middle" class="sans body">lower preprocessing cost</text>

  <path d="M315 345 H440 V455 H500" class="blueflow"/>
  <rect x="345" y="368" width="105" height="38" fill="#F8F6EC"/>
  <text x="397" y="396" text-anchor="middle" class="sans label">full Leiden</text>
  <rect x="500" y="380" width="360" height="145" rx="9" fill="#EDF5FF" stroke="#27313A" stroke-width="3"/>
  <text x="680" y="428" text-anchor="middle" class="sans heading">Constrained refinement</text>
  <text x="680" y="470" text-anchor="middle" class="sans body">split and move again inside bounds</text>

  <path d="M860 452 H1040" class="blueflow"/>
  <rect x="1040" y="380" width="305" height="145" rx="9" fill="#E7F7EA" stroke="#27313A" stroke-width="3"/>
  <text x="1192" y="428" text-anchor="middle" class="sans heading">Aggregate</text>
  <text x="1192" y="470" text-anchor="middle" class="sans body">higher cost; different partition</text>

  <rect x="930" y="180" width="415" height="145" rx="9" fill="#F8F6EC" stroke="#27313A" stroke-width="3"/>
  <text x="1137" y="225" text-anchor="middle" class="sans heading">Trade-off</text>
  <text x="1137" y="267" text-anchor="middle" class="sans body">refinement can improve connectivity</text>
  <text x="1137" y="300" text-anchor="middle" class="sans body">but adds another local-move phase</text>
</svg>
