<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="535" viewBox="0 0 1200 535" role="img" aria-labelledby="title desc" fill="#27313A">
  <title id="title">Stage 6: the same v2 neighbors touch fewer property cache lines</title>
  <desc id="desc">With four vertex properties per cache line, relabeling changes three touched lines into two.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 Z" fill="#1769C2"/>
    </marker>
    <style>
      :root{color-scheme:light dark}
      @media(prefers-color-scheme:dark){
        [fill="#27313A"]{fill:#ECE7DD}[stroke="#27313A"]{stroke:#ECE7DD}
        [fill="#FFFFFF"]{fill:#1E2327}[fill="#F8F6EC"]{fill:#252A2E}
        [fill="#EDF5FF"]{fill:#273846}[fill="#E7F7EA"]{fill:#24382A}
        [fill="#FFF0D8"]{fill:#3B3122}[fill="#F7DEDC"]{fill:#3D292A}
        [fill="#EEE9FF"]{fill:#302C3C}[stroke="#9AA3AD"]{stroke:#747D86}
        [stroke="#1769C2"]{stroke:#63A8FF}[fill="#1769C2"]{fill:#63A8FF}
        .arrow{stroke:#63A8FF!important}.edge{stroke:#ECE7DD!important}
      }
      .sans{font-family:Arial,Helvetica,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,monospace}
      .title{font-size:32px;font-weight:700}.subtitle{font-size:18px}
      .domain{font-size:16px;font-weight:700;letter-spacing:1.2px}.heading{font-size:22px;font-weight:700}
      .label{font-size:18px;font-weight:700}.body{font-size:17px}.small{font-size:16px}
      .arrow{fill:none;stroke:#1769C2;stroke-width:3;marker-end:url(#arrow)}
      .edge{stroke:#27313A;stroke-width:2.2}
    </style>
  </defs>
  <rect width="1200" height="535" fill="#FFFFFF"/>
  <text x="42" y="47" class="sans title">Stage 6: the same v2 neighbors touch fewer property cache lines</text>
  <text x="42" y="75" class="sans subtitle">Same neighbor set; only the neighbor IDs and property addresses are relabeled.</text>
  <line x1="42" y1="99" x2="1158" y2="99" stroke="#27313A" stroke-width="2"/>
  <rect x="35" y="120" width="500" height="330" rx="10" fill="#F7DEDC" stroke="#27313A" stroke-width="3"/>
  <text x="60" y="155" class="sans heading">Before: old neighbor IDs</text>
  <rect x="60.00" y="215" width="112.50" height="54" fill="#E7F7EA" stroke="#27313A" stroke-width="1.5"/>
  <text x="116" y="247" class="mono small" text-anchor="middle">1</text>
  <rect x="172.50" y="215" width="112.50" height="54" fill="#E7F7EA" stroke="#27313A" stroke-width="1.5"/>
  <text x="228" y="247" class="mono small" text-anchor="middle">4</text>
  <rect x="285.00" y="215" width="112.50" height="54" fill="#E7F7EA" stroke="#27313A" stroke-width="1.5"/>
  <text x="341" y="247" class="mono small" text-anchor="middle">6</text>
  <rect x="397.50" y="215" width="112.50" height="54" fill="#E7F7EA" stroke="#27313A" stroke-width="1.5"/>
  <text x="453" y="247" class="mono small" text-anchor="middle">8</text>
  <rect x="60.00" y="206" width="112.50" height="72" fill="none" stroke="#1769C2" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="116" y="297" class="mono small" text-anchor="middle">line 0</text>
  <rect x="172.50" y="206" width="225.00" height="72" fill="none" stroke="#1769C2" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="285" y="297" class="mono small" text-anchor="middle">line 1</text>
  <rect x="397.50" y="206" width="112.50" height="72" fill="none" stroke="#1769C2" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="453" y="297" class="mono small" text-anchor="middle">line 2</text>
  <text x="285" y="331" class="sans label" text-anchor="middle">3 distinct property cache lines</text>
  <text x="285" y="390" class="mono label" text-anchor="middle">span = 7</text>
  <rect x="665" y="120" width="500" height="330" rx="10" fill="#E7F7EA" stroke="#27313A" stroke-width="3"/>
  <circle cx="695" cy="150" r="17" fill="#27313A" stroke="#27313A" stroke-width="1"/>
  <text x="695" y="156" class="sans label" text-anchor="middle" fill="#FFFFFF">6</text>
  <text x="735" y="157" class="sans heading">After: new neighbor IDs</text>
  <rect x="690.00" y="215" width="112.50" height="54" fill="#E7F7EA" stroke="#27313A" stroke-width="1.5"/>
  <text x="746" y="247" class="mono small" text-anchor="middle">1</text>
  <rect x="802.50" y="215" width="112.50" height="54" fill="#E7F7EA" stroke="#27313A" stroke-width="1.5"/>
  <text x="858" y="247" class="mono small" text-anchor="middle">2</text>
  <rect x="915.00" y="215" width="112.50" height="54" fill="#E7F7EA" stroke="#27313A" stroke-width="1.5"/>
  <text x="971" y="247" class="mono small" text-anchor="middle">3</text>
  <rect x="1027.50" y="215" width="112.50" height="54" fill="#E7F7EA" stroke="#27313A" stroke-width="1.5"/>
  <text x="1083" y="247" class="mono small" text-anchor="middle">5</text>
  <rect x="690.00" y="206" width="337.50" height="72" fill="none" stroke="#1769C2" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="858" y="297" class="mono small" text-anchor="middle">line 0</text>
  <rect x="1027.50" y="206" width="112.50" height="72" fill="none" stroke="#1769C2" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="1083" y="297" class="mono small" text-anchor="middle">line 1</text>
  <text x="915" y="331" class="sans label" text-anchor="middle">2 distinct property cache lines</text>
  <text x="915" y="390" class="mono label" text-anchor="middle">span = 4</text>
  <path d="M535 290 H661" class="arrow"/>
  <rect x="144" y="475" width="912" height="44" rx="9" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="600" y="502" class="sans small" text-anchor="middle">Invariant: v2 still reads the same four neighbor properties; address locality is the only payoff shown.</text>
</svg>
