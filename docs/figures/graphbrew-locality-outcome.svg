<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="535" viewBox="0 0 1200 535" role="img" aria-labelledby="title desc" fill="#27313A">
  <title id="title">Stage 6: the same v2 neighbors touch fewer property cache lines</title>
  <desc id="desc">With four vertex properties per cache line, relabeling changes three touched lines into two.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 Z" fill="#1769C2"/>
    </marker>
    <style>
      :root{color-scheme:light dark}
      @media(prefers-color-scheme:dark){
        [fill="#27313A"]{fill:#ECE7DD}[stroke="#27313A"]{stroke:#ECE7DD}
        [fill="#FFFFFF"]{fill:#1E2327}[fill="#F8F6EC"]{fill:#252A2E}
        [fill="#EDF5FF"]{fill:#273846}[fill="#E7F7EA"]{fill:#24382A}
        [fill="#FFF0D8"]{fill:#3B3122}[fill="#F7DEDC"]{fill:#3D292A}
        [fill="#EEE9FF"]{fill:#302C3C}[stroke="#9AA3AD"]{stroke:#747D86}
        [stroke="#1769C2"]{stroke:#63A8FF}[fill="#1769C2"]{fill:#63A8FF}
        [stroke="#B45309"]{stroke:#F0B35A}[stroke="#15803D"]{stroke:#63D68B}
        .arrow{stroke:#63A8FF!important}.edge{stroke:#ECE7DD!important}
      }
      .sans{font-family:Arial,Helvetica,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,monospace}
      .title{font-size:32px;font-weight:700}.subtitle{font-size:18px}
      .domain{font-size:16px;font-weight:700;letter-spacing:1.2px}.heading{font-size:22px;font-weight:700}
      .label{font-size:18px;font-weight:700}.body{font-size:17px}.small{font-size:16px}.micro{font-size:14px;font-weight:700}
      .arrow{fill:none;stroke:#1769C2;stroke-width:3;marker-end:url(#arrow)}
      .edge{stroke:#27313A;stroke-width:2.2}
    </style>
  </defs>
  <rect width="1200" height="535" fill="#FFFFFF"/>
  <text x="42" y="47" class="sans title">Stage 6: the same v2 neighbors touch fewer property cache lines</text>
  <text x="42" y="75" class="sans subtitle">Same neighbor set; only the neighbor IDs and property addresses are relabeled.</text>
  <line x1="42" y1="99" x2="1158" y2="99" stroke="#27313A" stroke-width="2"/>
  <rect x="25" y="112" width="1150" height="350" rx="12" fill="none" stroke="#9AA3AD" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="45" y="136" class="sans domain">STAGE 6 · LOCALITY OUTCOME</text>
  <rect x="45" y="150" width="490" height="300" rx="10" fill="#F8F6EC" stroke="#F7DEDC" stroke-width="2"/>
  <text x="70" y="185" class="sans heading">Before: old neighbor IDs</text>
  <rect x="70.00" y="225" width="110.00" height="54" fill="#E7F7EA" stroke="#27313A" stroke-width="1.5"/>
  <text x="125" y="257" class="mono small" text-anchor="middle">1</text>
  <rect x="180.00" y="225" width="110.00" height="54" fill="#E7F7EA" stroke="#27313A" stroke-width="1.5"/>
  <text x="235" y="257" class="mono small" text-anchor="middle">4</text>
  <rect x="290.00" y="225" width="110.00" height="54" fill="#E7F7EA" stroke="#27313A" stroke-width="1.5"/>
  <text x="345" y="257" class="mono small" text-anchor="middle">6</text>
  <rect x="400.00" y="225" width="110.00" height="54" fill="#E7F7EA" stroke="#27313A" stroke-width="1.5"/>
  <text x="455" y="257" class="mono small" text-anchor="middle">8</text>
  <rect x="70.00" y="216" width="110.00" height="72" fill="none" stroke="#1769C2" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="125" y="307" class="mono small" text-anchor="middle">line 0</text>
  <rect x="180.00" y="216" width="220.00" height="72" fill="none" stroke="#1769C2" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="290" y="307" class="mono small" text-anchor="middle">line 1</text>
  <rect x="400.00" y="216" width="110.00" height="72" fill="none" stroke="#1769C2" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="455" y="307" class="mono small" text-anchor="middle">line 2</text>
  <text x="290" y="341" class="sans label" text-anchor="middle">3 distinct property cache lines</text>
  <text x="290" y="400" class="mono label" text-anchor="middle">span = 7</text>
  <rect x="665" y="150" width="490" height="300" rx="10" fill="#F8F6EC" stroke="#E7F7EA" stroke-width="2"/>
  <circle cx="695" cy="180" r="17" fill="#27313A" stroke="#27313A" stroke-width="1"/>
  <text x="695" y="186" class="sans label" text-anchor="middle" fill="#FFFFFF">6</text>
  <text x="735" y="187" class="sans heading">After: new neighbor IDs</text>
  <rect x="690.00" y="225" width="110.00" height="54" fill="#E7F7EA" stroke="#27313A" stroke-width="1.5"/>
  <text x="745" y="257" class="mono small" text-anchor="middle">1</text>
  <rect x="800.00" y="225" width="110.00" height="54" fill="#E7F7EA" stroke="#27313A" stroke-width="1.5"/>
  <text x="855" y="257" class="mono small" text-anchor="middle">2</text>
  <rect x="910.00" y="225" width="110.00" height="54" fill="#E7F7EA" stroke="#27313A" stroke-width="1.5"/>
  <text x="965" y="257" class="mono small" text-anchor="middle">3</text>
  <rect x="1020.00" y="225" width="110.00" height="54" fill="#E7F7EA" stroke="#27313A" stroke-width="1.5"/>
  <text x="1075" y="257" class="mono small" text-anchor="middle">5</text>
  <rect x="690.00" y="216" width="330.00" height="72" fill="none" stroke="#1769C2" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="855" y="307" class="mono small" text-anchor="middle">line 0</text>
  <rect x="1020.00" y="216" width="110.00" height="72" fill="none" stroke="#1769C2" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="1075" y="307" class="mono small" text-anchor="middle">line 1</text>
  <text x="910" y="341" class="sans label" text-anchor="middle">2 distinct property cache lines</text>
  <text x="910" y="400" class="mono label" text-anchor="middle">span = 4</text>
  <path d="M535 300 H661" class="arrow"/>
  <rect x="144" y="475" width="912" height="44" rx="9" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="600" y="502" class="sans small" text-anchor="middle">Invariant: v2 still reads the same four neighbor properties; address locality is the only payoff shown.</text>
</svg>
