<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc">
  <title id="title">gordf5000 community-size fallback</title>
  <desc id="desc">Communities with at most 5000 vertices use Gorder with window eight. Communities larger than 5000 vertices use a hub-rooted BFS fallback.</desc>
  <style>
    .sans{font-family:Arial,Helvetica,sans-serif}
    .title{font-size:40px;font-weight:700;fill:#17212B}
    .subtitle{font-size:22px;fill:#4B5560}
    .heading{font-size:28px;font-weight:700;fill:#17212B}
    .body{font-size:22px;fill:#27313A}
    .label{font-size:20px;font-weight:700;fill:#27313A}
    .edge{stroke:#6B7075;stroke-width:6}
  </style>
  <rect width="1400" height="600" fill="#FFFFFF"/>
  <text x="45" y="55" class="sans title">gordf5000: choose local ordering by community size</text>
  <text x="45" y="88" class="sans subtitle">The threshold applies to each detected community, never to the whole graph.</text>
  <line x1="45" y1="112" x2="1355" y2="112" stroke="#17212B" stroke-width="2"/>

  <rect x="55" y="150" width="600" height="365" rx="14" fill="#FFF8EB" stroke="#F7941D" stroke-width="4"/>
  <text x="355" y="195" text-anchor="middle" class="sans heading">Community size &lt;= 5,000</text>
  <circle cx="355" cy="315" r="105" fill="none" stroke="#F7941D" stroke-width="7" stroke-dasharray="3 14"/>
  <line x1="290" y1="300" x2="350" y2="245" class="edge"/>
  <line x1="290" y1="300" x2="340" y2="375" class="edge"/>
  <line x1="350" y1="245" x2="425" y2="310" class="edge"/>
  <line x1="340" y1="375" x2="425" y2="310" class="edge"/>
  <circle cx="290" cy="300" r="27" fill="#F7941D" stroke="#17212B" stroke-width="2"/>
  <circle cx="350" cy="245" r="27" fill="#FFC13A" stroke="#17212B" stroke-width="2"/>
  <circle cx="340" cy="375" r="27" fill="#FFE8A6" stroke="#17212B" stroke-width="2"/>
  <circle cx="425" cy="310" r="27" fill="#FFD870" stroke="#17212B" stroke-width="2"/>
  <rect x="175" y="440" width="360" height="55" rx="10" fill="#FFFFFF" stroke="#F7941D" stroke-width="3"/>
  <text x="355" y="475" text-anchor="middle" class="sans heading">Gorder, window = 8</text>

  <rect x="745" y="150" width="600" height="365" rx="14" fill="#EEF6FC" stroke="#1683BD" stroke-width="4"/>
  <text x="1045" y="195" text-anchor="middle" class="sans heading">Community size &gt; 5,000</text>
  <circle cx="1045" cy="315" r="120" fill="none" stroke="#1683BD" stroke-width="7" stroke-dasharray="3 14"/>
  <circle cx="1045" cy="315" r="30" fill="#1683BD" stroke="#17212B" stroke-width="2"/>
  <circle cx="965" cy="255" r="25" fill="#49A9D7" stroke="#17212B" stroke-width="2"/>
  <circle cx="1125" cy="255" r="25" fill="#49A9D7" stroke="#17212B" stroke-width="2"/>
  <circle cx="930" cy="355" r="23" fill="#83C7E8" stroke="#17212B" stroke-width="2"/>
  <circle cx="990" cy="405" r="23" fill="#83C7E8" stroke="#17212B" stroke-width="2"/>
  <circle cx="1100" cy="405" r="23" fill="#B9DEF2" stroke="#17212B" stroke-width="2"/>
  <circle cx="1160" cy="355" r="23" fill="#B9DEF2" stroke="#17212B" stroke-width="2"/>
  <line x1="1021" y1="297" x2="986" y2="271" class="edge"/>
  <line x1="1069" y1="297" x2="1104" y2="271" class="edge"/>
  <line x1="1016" y1="326" x2="951" y2="350" class="edge"/>
  <line x1="1031" y1="342" x2="998" y2="385" class="edge"/>
  <line x1="1059" y1="342" x2="1092" y2="385" class="edge"/>
  <line x1="1074" y1="326" x2="1139" y2="350" class="edge"/>
  <rect x="865" y="440" width="360" height="55" rx="10" fill="#FFFFFF" stroke="#1683BD" stroke-width="3"/>
  <text x="1045" y="475" text-anchor="middle" class="sans heading">hub-rooted BFS</text>

  <rect x="170" y="535" width="1060" height="45" rx="10" fill="#F8FAFB" stroke="#17212B" stroke-width="2"/>
  <text x="700" y="565" text-anchor="middle" class="sans body">One million-vertex graph can use Gorder on small blocks and BFS only on its large blocks.</text>
</svg>
