<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc" fill="#27313A" data-figure-schema="graphbrew-public/v4">
  <title id="title">Stage 3: SizeDesc turns memberships into contiguous blocks</title>
  <desc id="desc">C0 has 5 vertices, so it receives IDs 0..4; C1 receives IDs 5..8.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 Z" fill="#1769C2"/>
    </marker>
    <style>
      :root{color-scheme:light dark}
      @media(prefers-color-scheme:dark){
        [fill="#27313A"]{fill:#ECE7DD}[stroke="#27313A"]{stroke:#ECE7DD}
        [fill="#FFFFFF"]{fill:#1E2327}[fill="#F8F6EC"]{fill:#252A2E}
        [fill="#EDF5FF"]{fill:#273846}[fill="#E7F7EA"]{fill:#24382A}
        [fill="#FFF0D8"]{fill:#3B3122}[fill="#F7DEDC"]{fill:#3D292A}
        [fill="#EEE9FF"]{fill:#302C3C}[stroke="#9AA3AD"]{stroke:#747D86}
        [stroke="#1769C2"]{stroke:#63A8FF}[fill="#1769C2"]{fill:#63A8FF}
        [stroke="#B45309"]{stroke:#F0B35A}[stroke="#15803D"]{stroke:#63D68B}
        .arrow{stroke:#63A8FF!important}.edge{stroke:#ECE7DD!important}
      }
      .sans{font-family:Arial,Helvetica,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,monospace}
      .title{font-size:32px;font-weight:700}.subtitle{font-size:18px}
      .domain{font-size:16px;font-weight:700;letter-spacing:1.2px}.heading{font-size:22px;font-weight:700}
      .label{font-size:18px;font-weight:700}.body{font-size:17px}.small{font-size:16px}.micro{font-size:14px;font-weight:700}
      .arrow{fill:none;stroke:#1769C2;stroke-width:3;marker-end:url(#arrow)}
      .edge{stroke:#27313A;stroke-width:2.2}
    </style>
  </defs>
  <rect width="1200" height="550" fill="#FFFFFF"/>
  <text x="42" y="47" class="sans title">Stage 3: SizeDesc turns memberships into contiguous blocks</text>
  <text x="42" y="75" class="sans subtitle">Same C0/C1 membership from Stage 2; only the global block order changes.</text>
  <line x1="42" y1="99" x2="1158" y2="99" stroke="#27313A" stroke-width="2"/>
  <rect x="25" y="112" width="1150" height="350" rx="12" fill="none" stroke="#9AA3AD" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="45" y="136" class="sans domain">STAGE 3 · BLOCK LAYOUT</text>
  <rect x="45" y="150" width="500" height="300" rx="10" fill="#F8F6EC" stroke="#9AA3AD" stroke-width="2"/>
  <text x="70" y="185" class="sans heading">Input-ID memory order</text>
  <rect x="70.00" y="210" width="50.00" height="52" fill="#FFF0D8" stroke="#27313A" stroke-width="1.5"/>
  <text x="95" y="241" class="mono small" text-anchor="middle">v0</text>
  <rect x="120.00" y="210" width="50.00" height="52" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="145" y="241" class="mono small" text-anchor="middle">v1</text>
  <rect x="170.00" y="210" width="50.00" height="52" fill="#EDF5FF" stroke="#1769C2" stroke-width="3"/>
  <text x="195" y="241" class="mono small" text-anchor="middle">v2</text>
  <rect x="220.00" y="210" width="50.00" height="52" fill="#FFF0D8" stroke="#27313A" stroke-width="1.5"/>
  <text x="245" y="241" class="mono small" text-anchor="middle">v3</text>
  <rect x="270.00" y="210" width="50.00" height="52" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="295" y="241" class="mono small" text-anchor="middle">v4</text>
  <rect x="320.00" y="210" width="50.00" height="52" fill="#FFF0D8" stroke="#27313A" stroke-width="1.5"/>
  <text x="345" y="241" class="mono small" text-anchor="middle">v5</text>
  <rect x="370.00" y="210" width="50.00" height="52" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="395" y="241" class="mono small" text-anchor="middle">v6</text>
  <rect x="420.00" y="210" width="50.00" height="52" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="445" y="241" class="mono small" text-anchor="middle">v7</text>
  <rect x="470.00" y="210" width="50.00" height="52" fill="#FFF0D8" stroke="#27313A" stroke-width="1.5"/>
  <text x="495" y="241" class="mono small" text-anchor="middle">v8</text>
  <text x="70" y="295" class="sans body">C0 and C1 are interleaved.</text>
  <text x="70" y="331" class="mono body">v2 is at old ID 2</text>
  <rect x="70" y="365" width="450" height="54" rx="7" fill="#FFFFFF" stroke="#27313A" stroke-width="2"/>
  <text x="295" y="398" class="mono label" text-anchor="middle">C0 size 5 &gt; C1 size 4</text>
  <rect x="655" y="150" width="500" height="300" rx="10" fill="#F8F6EC" stroke="#B45309" stroke-width="2"/>
  <circle cx="685" cy="180" r="17" fill="#27313A" stroke="#27313A" stroke-width="1"/>
  <text x="685" y="186" class="sans label" text-anchor="middle" fill="#FFFFFF">3</text>
  <text x="712" y="187" class="sans heading">SizeDesc block order</text>
  <rect x="680.00" y="210" width="50.00" height="52" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="705" y="241" class="mono small" text-anchor="middle">v1</text>
  <rect x="730.00" y="210" width="50.00" height="52" fill="#EDF5FF" stroke="#1769C2" stroke-width="3"/>
  <text x="755" y="241" class="mono small" text-anchor="middle">v2</text>
  <rect x="780.00" y="210" width="50.00" height="52" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="805" y="241" class="mono small" text-anchor="middle">v4</text>
  <rect x="830.00" y="210" width="50.00" height="52" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="855" y="241" class="mono small" text-anchor="middle">v6</text>
  <rect x="880.00" y="210" width="50.00" height="52" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="905" y="241" class="mono small" text-anchor="middle">v7</text>
  <rect x="930.00" y="210" width="50.00" height="52" fill="#FFF0D8" stroke="#27313A" stroke-width="1.5"/>
  <text x="955" y="241" class="mono small" text-anchor="middle">v0</text>
  <rect x="980.00" y="210" width="50.00" height="52" fill="#FFF0D8" stroke="#27313A" stroke-width="1.5"/>
  <text x="1005" y="241" class="mono small" text-anchor="middle">v3</text>
  <rect x="1030.00" y="210" width="50.00" height="52" fill="#FFF0D8" stroke="#27313A" stroke-width="1.5"/>
  <text x="1055" y="241" class="mono small" text-anchor="middle">v5</text>
  <rect x="1080.00" y="210" width="50.00" height="52" fill="#FFF0D8" stroke="#27313A" stroke-width="1.5"/>
  <text x="1105" y="241" class="mono small" text-anchor="middle">v8</text>
  <text x="680" y="295" class="sans body">C0 occupies new IDs 0..4.</text>
  <text x="680" y="325" class="sans body">C1 occupies new IDs 5..8.</text>
  <text x="680" y="365" class="mono label">old v2 -&gt; block ID 1</text>
  <path d="M545 300 H651" class="arrow"/>
  <rect x="144" y="480" width="912" height="44" rx="9" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="600" y="507" class="sans small" text-anchor="middle">Invariant: community membership and graph topology are unchanged; only block placement changes.</text>
</svg>
