<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc" fill="#27313A">
  <title id="title">Stage 3: SizeDesc turns memberships into contiguous blocks</title>
  <desc id="desc">C0 has 5 vertices, so it receives IDs 0..4; C1 receives IDs 5..8.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 Z" fill="#1769C2"/>
    </marker>
    <style>
      :root{color-scheme:light dark}
      @media(prefers-color-scheme:dark){
        [fill="#27313A"]{fill:#ECE7DD}[stroke="#27313A"]{stroke:#ECE7DD}
        [fill="#FFFFFF"]{fill:#1E2327}[fill="#F8F6EC"]{fill:#252A2E}
        [fill="#EDF5FF"]{fill:#273846}[fill="#E7F7EA"]{fill:#24382A}
        [fill="#FFF0D8"]{fill:#3B3122}[fill="#F7DEDC"]{fill:#3D292A}
        [fill="#EEE9FF"]{fill:#302C3C}[stroke="#9AA3AD"]{stroke:#747D86}
        [stroke="#1769C2"]{stroke:#63A8FF}[fill="#1769C2"]{fill:#63A8FF}
        .arrow{stroke:#63A8FF!important}.edge{stroke:#ECE7DD!important}
      }
      .sans{font-family:Arial,Helvetica,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,monospace}
      .title{font-size:32px;font-weight:700}.subtitle{font-size:18px}
      .domain{font-size:16px;font-weight:700;letter-spacing:1.2px}.heading{font-size:22px;font-weight:700}
      .label{font-size:18px;font-weight:700}.body{font-size:17px}.small{font-size:16px}
      .arrow{fill:none;stroke:#1769C2;stroke-width:3;marker-end:url(#arrow)}
      .edge{stroke:#27313A;stroke-width:2.2}
    </style>
  </defs>
  <rect width="1200" height="550" fill="#FFFFFF"/>
  <text x="42" y="47" class="sans title">Stage 3: SizeDesc turns memberships into contiguous blocks</text>
  <text x="42" y="75" class="sans subtitle">Same C0/C1 membership from Stage 2; only the global block order changes.</text>
  <line x1="42" y1="99" x2="1158" y2="99" stroke="#27313A" stroke-width="2"/>
  <rect x="35" y="125" width="520" height="330" rx="10" fill="#EDF5FF" stroke="#27313A" stroke-width="3"/>
  <text x="60" y="160" class="sans heading">Input-ID memory order</text>
  <rect x="60.00" y="195" width="52.22" height="52" fill="#FFF0D8" stroke="#27313A" stroke-width="1.5"/>
  <text x="86" y="226" class="mono small" text-anchor="middle">v0</text>
  <rect x="112.22" y="195" width="52.22" height="52" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="138" y="226" class="mono small" text-anchor="middle">v1</text>
  <rect x="164.44" y="195" width="52.22" height="52" fill="#EDF5FF" stroke="#1769C2" stroke-width="3"/>
  <text x="190" y="226" class="mono small" text-anchor="middle">v2</text>
  <rect x="216.67" y="195" width="52.22" height="52" fill="#FFF0D8" stroke="#27313A" stroke-width="1.5"/>
  <text x="242" y="226" class="mono small" text-anchor="middle">v3</text>
  <rect x="268.89" y="195" width="52.22" height="52" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="295" y="226" class="mono small" text-anchor="middle">v4</text>
  <rect x="321.11" y="195" width="52.22" height="52" fill="#FFF0D8" stroke="#27313A" stroke-width="1.5"/>
  <text x="347" y="226" class="mono small" text-anchor="middle">v5</text>
  <rect x="373.33" y="195" width="52.22" height="52" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="399" y="226" class="mono small" text-anchor="middle">v6</text>
  <rect x="425.56" y="195" width="52.22" height="52" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="451" y="226" class="mono small" text-anchor="middle">v7</text>
  <rect x="477.78" y="195" width="52.22" height="52" fill="#FFF0D8" stroke="#27313A" stroke-width="1.5"/>
  <text x="503" y="226" class="mono small" text-anchor="middle">v8</text>
  <text x="60" y="290" class="sans body">C0 and C1 are interleaved.</text>
  <text x="60" y="326" class="mono body">v2 is at old ID 2</text>
  <rect x="60" y="365" width="470" height="54" rx="7" fill="#FFFFFF" stroke="#27313A" stroke-width="2"/>
  <text x="295" y="398" class="mono label" text-anchor="middle">C0 size 5 &gt; C1 size 4</text>
  <rect x="645" y="125" width="520" height="330" rx="10" fill="#FFF0D8" stroke="#27313A" stroke-width="3"/>
  <circle cx="675" cy="155" r="17" fill="#27313A" stroke="#27313A" stroke-width="1"/>
  <text x="675" y="161" class="sans label" text-anchor="middle" fill="#FFFFFF">3</text>
  <text x="702" y="162" class="sans heading">SizeDesc block order</text>
  <rect x="670.00" y="195" width="52.22" height="52" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="696" y="226" class="mono small" text-anchor="middle">v1</text>
  <rect x="722.22" y="195" width="52.22" height="52" fill="#EDF5FF" stroke="#1769C2" stroke-width="3"/>
  <text x="748" y="226" class="mono small" text-anchor="middle">v2</text>
  <rect x="774.44" y="195" width="52.22" height="52" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="800" y="226" class="mono small" text-anchor="middle">v4</text>
  <rect x="826.67" y="195" width="52.22" height="52" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="852" y="226" class="mono small" text-anchor="middle">v6</text>
  <rect x="878.89" y="195" width="52.22" height="52" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="905" y="226" class="mono small" text-anchor="middle">v7</text>
  <rect x="931.11" y="195" width="52.22" height="52" fill="#FFF0D8" stroke="#27313A" stroke-width="1.5"/>
  <text x="957" y="226" class="mono small" text-anchor="middle">v0</text>
  <rect x="983.33" y="195" width="52.22" height="52" fill="#FFF0D8" stroke="#27313A" stroke-width="1.5"/>
  <text x="1009" y="226" class="mono small" text-anchor="middle">v3</text>
  <rect x="1035.56" y="195" width="52.22" height="52" fill="#FFF0D8" stroke="#27313A" stroke-width="1.5"/>
  <text x="1061" y="226" class="mono small" text-anchor="middle">v5</text>
  <rect x="1087.78" y="195" width="52.22" height="52" fill="#FFF0D8" stroke="#27313A" stroke-width="1.5"/>
  <text x="1113" y="226" class="mono small" text-anchor="middle">v8</text>
  <text x="670" y="290" class="sans body">C0 occupies new IDs 0..4.</text>
  <text x="670" y="320" class="sans body">C1 occupies new IDs 5..8.</text>
  <text x="670" y="365" class="mono label">old v2 -&gt; block ID 1</text>
  <path d="M555 290 H641" class="arrow"/>
  <rect x="144" y="480" width="912" height="44" rx="9" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="600" y="507" class="sans small" text-anchor="middle">Invariant: community membership and graph topology are unchanged; only block placement changes.</text>
</svg>
