<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc" fill="#27313A">
  <title id="title">Stage 1: load the graph and expose the tracked CSR row</title>
  <desc id="desc">The input graph, CSR arrays, and lightweight profile all refer to vertex v2.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 Z" fill="#1769C2"/>
    </marker>
    <style>
      :root{color-scheme:light dark}
      @media(prefers-color-scheme:dark){
        [fill="#27313A"]{fill:#ECE7DD}[stroke="#27313A"]{stroke:#ECE7DD}
        [fill="#FFFFFF"]{fill:#1E2327}[fill="#F8F6EC"]{fill:#252A2E}
        [fill="#EDF5FF"]{fill:#273846}[fill="#E7F7EA"]{fill:#24382A}
        [fill="#FFF0D8"]{fill:#3B3122}[fill="#F7DEDC"]{fill:#3D292A}
        [fill="#EEE9FF"]{fill:#302C3C}[stroke="#9AA3AD"]{stroke:#747D86}
        [stroke="#1769C2"]{stroke:#63A8FF}[fill="#1769C2"]{fill:#63A8FF}
        .arrow{stroke:#63A8FF!important}.edge{stroke:#ECE7DD!important}
      }
      .sans{font-family:Arial,Helvetica,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,monospace}
      .title{font-size:32px;font-weight:700}.subtitle{font-size:18px}
      .domain{font-size:16px;font-weight:700;letter-spacing:1.2px}.heading{font-size:22px;font-weight:700}
      .label{font-size:18px;font-weight:700}.body{font-size:17px}.small{font-size:16px}
      .arrow{fill:none;stroke:#1769C2;stroke-width:3;marker-end:url(#arrow)}
      .edge{stroke:#27313A;stroke-width:2.2}
    </style>
  </defs>
  <rect width="1200" height="560" fill="#FFFFFF"/>
  <text x="42" y="47" class="sans title">Stage 1: load the graph and expose the tracked CSR row</text>
  <text x="42" y="75" class="sans subtitle">Illustrative 9-vertex graph; tracked object v2 is outlined in blue.</text>
  <line x1="42" y1="99" x2="1158" y2="99" stroke="#27313A" stroke-width="2"/>
  <rect x="35" y="120" width="340" height="360" rx="10" fill="#EDF5FF" stroke="#27313A" stroke-width="3"/>
  <circle cx="65" cy="150" r="17" fill="#27313A" stroke="#27313A" stroke-width="1"/>
  <text x="65" y="156" class="sans label" text-anchor="middle" fill="#FFFFFF">1</text>
  <text x="92" y="157" class="sans heading">Input topology</text>
  <line x1="79" y1="215" x2="120" y2="179" class="edge"/>
  <line x1="79" y1="215" x2="120" y2="251" class="edge"/>
  <line x1="120" y1="179" x2="169" y2="215" class="edge"/>
  <line x1="120" y1="251" x2="169" y2="215" class="edge"/>
  <line x1="169" y1="215" x2="219" y2="179" class="edge"/>
  <line x1="169" y1="215" x2="263" y2="215" class="edge"/>
  <line x1="219" y1="179" x2="263" y2="215" class="edge"/>
  <line x1="219" y1="179" x2="312" y2="179" class="edge"/>
  <line x1="263" y1="215" x2="238" y2="259" class="edge"/>
  <line x1="263" y1="215" x2="312" y2="251" class="edge"/>
  <line x1="238" y1="259" x2="312" y2="251" class="edge"/>
  <line x1="312" y1="251" x2="312" y2="179" class="edge"/>
  <circle cx="79" cy="215" r="20" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="79" y="220" class="sans label" text-anchor="middle">0</text>
  <circle cx="219" cy="179" r="20" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="219" y="184" class="sans label" text-anchor="middle">1</text>
  <circle cx="263" cy="215" r="23" fill="#E7F7EA" stroke="#1769C2" stroke-width="3"/>
  <text x="263" y="220" class="sans label" text-anchor="middle">2</text>
  <circle cx="120" cy="179" r="20" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="120" y="184" class="sans label" text-anchor="middle">3</text>
  <circle cx="238" cy="259" r="20" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="238" y="264" class="sans label" text-anchor="middle">4</text>
  <circle cx="120" cy="251" r="20" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="120" y="256" class="sans label" text-anchor="middle">5</text>
  <circle cx="312" cy="251" r="20" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="312" y="256" class="sans label" text-anchor="middle">6</text>
  <circle cx="312" cy="179" r="20" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="312" y="184" class="sans label" text-anchor="middle">7</text>
  <circle cx="169" cy="215" r="20" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="169" y="220" class="sans label" text-anchor="middle">8</text>
  <text x="60" y="440" class="sans small">12 undirected edges / 24 CSR arcs</text>
  <rect x="405" y="120" width="365" height="360" rx="10" fill="#FFF0D8" stroke="#27313A" stroke-width="3"/>
  <text x="430" y="157" class="sans heading">CSR row for v2</text>
  <text x="430" y="194" class="mono body">offsets[2:4] = [5, 9]</text>
  <text x="430" y="230" class="sans body">col_idx positions 5..8</text>
  <rect x="430.00" y="250" width="77.50" height="54" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="468" y="282" class="mono small" text-anchor="middle">1</text>
  <rect x="507.50" y="250" width="77.50" height="54" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="546" y="282" class="mono small" text-anchor="middle">4</text>
  <rect x="585.00" y="250" width="77.50" height="54" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="623" y="282" class="mono small" text-anchor="middle">6</text>
  <rect x="662.50" y="250" width="77.50" height="54" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="701" y="282" class="mono small" text-anchor="middle">8</text>
  <text x="430" y="338" class="sans body">neighbor IDs span 1..8</text>
  <text x="430" y="368" class="mono label">span = 7</text>
  <text x="430" y="410" class="sans body">Property IDs touch cache lines:</text>
  <text x="430" y="440" class="mono small">[0, 1, 1, 2] -&gt; 3 distinct lines</text>
  <rect x="800" y="120" width="365" height="360" rx="10" fill="#EEE9FF" stroke="#27313A" stroke-width="3"/>
  <text x="825" y="157" class="sans heading">Lightweight profile</text>
  <text x="825" y="200" class="mono body">N = 9</text>
  <text x="825" y="232" class="mono body">directed arcs = 24</text>
  <text x="825" y="264" class="mono body">degree(v2) = 4</text>
  <text x="825" y="296" class="mono body">max degree = 4</text>
  <text x="825" y="342" class="sans body">These values describe the input.</text>
  <text x="825" y="370" class="sans body">No kernel has run and no labels moved.</text>
  <rect x="825" y="406" width="315" height="42" rx="7" fill="#FFFFFF" stroke="#27313A" stroke-width="2"/>
  <text x="982" y="433" class="mono label" text-anchor="middle">tracked = v2</text>
  <path d="M375 300 H401" class="arrow"/>
  <path d="M770 300 H796" class="arrow"/>
  <rect x="144" y="500" width="912" height="44" rx="9" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="600" y="527" class="sans small" text-anchor="middle">Invariant: Stage 1 observes the graph; it does not change IDs, edges, or kernel work.</text>
</svg>
