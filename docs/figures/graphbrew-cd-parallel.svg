<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc" fill="#27313A">
  <title id="title">Control A: cd_serial versus cd_parallel</title>
  <desc id="desc">Both modes use the same graph and recipe; parallel move scheduling may change the realized membership and mapping.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 Z" fill="#1769C2"/>
    </marker>
    <style>
      :root{color-scheme:light dark}
      @media(prefers-color-scheme:dark){
        [fill="#27313A"]{fill:#ECE7DD}[stroke="#27313A"]{stroke:#ECE7DD}
        [fill="#FFFFFF"]{fill:#1E2327}[fill="#F8F6EC"]{fill:#252A2E}
        [fill="#EDF5FF"]{fill:#273846}[fill="#E7F7EA"]{fill:#24382A}
        [fill="#FFF0D8"]{fill:#3B3122}[fill="#F7DEDC"]{fill:#3D292A}
        [fill="#EEE9FF"]{fill:#302C3C}[stroke="#9AA3AD"]{stroke:#747D86}
        [stroke="#1769C2"]{stroke:#63A8FF}[fill="#1769C2"]{fill:#63A8FF}
        [stroke="#B45309"]{stroke:#F0B35A}[stroke="#15803D"]{stroke:#63D68B}
        .arrow{stroke:#63A8FF!important}.edge{stroke:#ECE7DD!important}
      }
      .sans{font-family:Arial,Helvetica,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,monospace}
      .title{font-size:32px;font-weight:700}.subtitle{font-size:18px}
      .domain{font-size:16px;font-weight:700;letter-spacing:1.2px}.heading{font-size:22px;font-weight:700}
      .label{font-size:18px;font-weight:700}.body{font-size:17px}.small{font-size:16px}.micro{font-size:14px;font-weight:700}
      .arrow{fill:none;stroke:#1769C2;stroke-width:3;marker-end:url(#arrow)}
      .edge{stroke:#27313A;stroke-width:2.2}
    </style>
  </defs>
  <rect width="1200" height="500" fill="#FFFFFF"/>
  <text x="42" y="47" class="sans title">Control A: cd_serial versus cd_parallel</text>
  <text x="42" y="75" class="sans subtitle">Running example IDs v0..v8; fingerprint equality, not the branch name, proves byte identity.</text>
  <line x1="42" y1="99" x2="1158" y2="99" stroke="#27313A" stroke-width="2"/>
  <rect x="25" y="112" width="1150" height="305" rx="12" fill="none" stroke="#9AA3AD" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="35" y="125" width="520" height="280" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
  <text x="60" y="160" class="sans heading">cd_serial</text>
  <text x="60" y="195" class="sans body">One ordered move stream.</text>
  <rect x="60.00" y="225" width="52.22" height="42" fill="#F8F6EC" stroke="#27313A" stroke-width="1.5"/>
  <text x="86" y="251" class="mono small" text-anchor="middle">v0</text>
  <rect x="112.22" y="225" width="52.22" height="42" fill="#F8F6EC" stroke="#27313A" stroke-width="1.5"/>
  <text x="138" y="251" class="mono small" text-anchor="middle">v1</text>
  <rect x="164.44" y="225" width="52.22" height="42" fill="#F8F6EC" stroke="#1769C2" stroke-width="3"/>
  <text x="190" y="251" class="mono small" text-anchor="middle">v2</text>
  <rect x="216.67" y="225" width="52.22" height="42" fill="#F8F6EC" stroke="#27313A" stroke-width="1.5"/>
  <text x="242" y="251" class="mono small" text-anchor="middle">v3</text>
  <rect x="268.89" y="225" width="52.22" height="42" fill="#F8F6EC" stroke="#27313A" stroke-width="1.5"/>
  <text x="295" y="251" class="mono small" text-anchor="middle">v4</text>
  <rect x="321.11" y="225" width="52.22" height="42" fill="#F8F6EC" stroke="#27313A" stroke-width="1.5"/>
  <text x="347" y="251" class="mono small" text-anchor="middle">v5</text>
  <rect x="373.33" y="225" width="52.22" height="42" fill="#F8F6EC" stroke="#27313A" stroke-width="1.5"/>
  <text x="399" y="251" class="mono small" text-anchor="middle">v6</text>
  <rect x="425.56" y="225" width="52.22" height="42" fill="#F8F6EC" stroke="#27313A" stroke-width="1.5"/>
  <text x="451" y="251" class="mono small" text-anchor="middle">v7</text>
  <rect x="477.78" y="225" width="52.22" height="42" fill="#F8F6EC" stroke="#27313A" stroke-width="1.5"/>
  <text x="503" y="251" class="mono small" text-anchor="middle">v8</text>
  <text x="60" y="310" class="mono body">membership fingerprint = M0</text>
  <text x="60" y="342" class="mono body">mapping fingerprint = P0</text>
  <rect x="645" y="125" width="520" height="280" rx="10" fill="#FFFFFF" stroke="#1769C2" stroke-width="2"/>
  <text x="670" y="160" class="sans heading">cd_parallel</text>
  <text x="670" y="195" class="sans body">Workers evaluate vertices concurrently.</text>
  <rect x="670.00" y="225" width="52.22" height="42" fill="#F8F6EC" stroke="#27313A" stroke-width="1.5"/>
  <text x="696" y="251" class="mono small" text-anchor="middle">v0</text>
  <rect x="722.22" y="225" width="52.22" height="42" fill="#F8F6EC" stroke="#27313A" stroke-width="1.5"/>
  <text x="748" y="251" class="mono small" text-anchor="middle">v1</text>
  <rect x="774.44" y="225" width="52.22" height="42" fill="#F8F6EC" stroke="#1769C2" stroke-width="3"/>
  <text x="800" y="251" class="mono small" text-anchor="middle">v2</text>
  <rect x="826.67" y="225" width="52.22" height="42" fill="#F8F6EC" stroke="#27313A" stroke-width="1.5"/>
  <text x="852" y="251" class="mono small" text-anchor="middle">v3</text>
  <rect x="878.89" y="225" width="52.22" height="42" fill="#F8F6EC" stroke="#27313A" stroke-width="1.5"/>
  <text x="905" y="251" class="mono small" text-anchor="middle">v4</text>
  <rect x="931.11" y="225" width="52.22" height="42" fill="#F8F6EC" stroke="#27313A" stroke-width="1.5"/>
  <text x="957" y="251" class="mono small" text-anchor="middle">v5</text>
  <rect x="983.33" y="225" width="52.22" height="42" fill="#F8F6EC" stroke="#27313A" stroke-width="1.5"/>
  <text x="1009" y="251" class="mono small" text-anchor="middle">v6</text>
  <rect x="1035.56" y="225" width="52.22" height="42" fill="#F8F6EC" stroke="#27313A" stroke-width="1.5"/>
  <text x="1061" y="251" class="mono small" text-anchor="middle">v7</text>
  <rect x="1087.78" y="225" width="52.22" height="42" fill="#F8F6EC" stroke="#27313A" stroke-width="1.5"/>
  <text x="1113" y="251" class="mono small" text-anchor="middle">v8</text>
  <text x="670" y="305" class="mono small">T0 {v0,v3,v6} | T1 {v1,v4,v7}</text>
  <text x="670" y="335" class="mono small">T2 {v2,v5,v8}</text>
  <text x="670" y="372" class="mono body">repeat draws -&gt; compare M/P</text>
  <path d="M555 270 H641" class="arrow"/>
  <rect x="144" y="430" width="912" height="44" rx="9" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="600" y="457" class="sans small" text-anchor="middle">Contract: schedule-sensitive builds are repeated; differing fingerprints must not be pooled.</text>
</svg>
