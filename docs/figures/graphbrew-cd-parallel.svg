<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc" fill="#27313A">
  <title id="title">cd_parallel execution</title>
  <desc id="desc">Serial community detection processes one move stream. cd_parallel distributes work across OpenMP lanes. The policy decision remains deterministic while the resulting mapping can be schedule-sensitive.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="9" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 Z" fill="#1769C2"/>
    </marker>
    <style>
      :root{color-scheme:light dark}
      @media(prefers-color-scheme:dark){
        [fill="#27313A"]{fill:#ECE7DD}[stroke="#27313A"]{stroke:#ECE7DD}
        [fill="#FFFFFF"]{fill:#1E2327}
        [fill="#F8F6EC"]{fill:#252A2E}[fill="#EDF5FF"]{fill:#273846}
        [fill="#E7F7EA"]{fill:#24382A}[fill="#FFF0D8"]{fill:#3B3122}
        [fill="#F7DEDC"]{fill:#3D292A}[fill="#EEE9FF"]{fill:#302C3C}
        [stroke="#9AA3AD"]{stroke:#747D86}
      }
      .sans{font-family:Arial,Helvetica,sans-serif}
      .title{font-size:44px;font-weight:700}.subtitle{font-size:24px}
      .domain{font-size:21px;font-weight:700;letter-spacing:1.3px}
      .heading{font-size:31px;font-weight:700}.body{font-size:24px}
      .label{font-size:22px;font-weight:700}
      .flow{fill:none;stroke:#1769C2;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="600" fill="#FFFFFF"/>
  <text x="45" y="55" class="sans title">cd_parallel: use the OpenMP thread team for Leiden</text>
  <text x="45" y="88" class="sans subtitle">It changes execution schedule, not the frozen selector decision.</text>
  <line x1="45" y1="112" x2="1355" y2="112" stroke="#27313A" stroke-width="2"/>

  <rect x="35" y="140" width="1330" height="370" rx="12" fill="none" stroke="#9AA3AD" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="52" y="166" class="sans domain">COMMUNITY-DETECTION SCHEDULE</text>
  <g transform="translate(0 35)">
  <rect x="45" y="150" width="610" height="315" rx="9" fill="#FFF0D8" stroke="#27313A" stroke-width="3"/>
  <text x="350" y="195" text-anchor="middle" class="sans heading">cd_serial</text>
  <text x="350" y="230" text-anchor="middle" class="sans body">one worker, one ordered move stream</text>
  <g transform="translate(90 285)" class="sans label" text-anchor="middle">
    <rect x="0" y="0" width="75" height="58" rx="8" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/><text x="37" y="37">v0</text>
    <rect x="90" y="0" width="75" height="58" rx="8" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/><text x="127" y="37">v1</text>
    <rect x="180" y="0" width="75" height="58" rx="8" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/><text x="217" y="37">v2</text>
    <rect x="270" y="0" width="75" height="58" rx="8" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/><text x="307" y="37">v3</text>
    <rect x="360" y="0" width="75" height="58" rx="8" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/><text x="397" y="37">v4</text>
    <rect x="450" y="0" width="75" height="58" rx="8" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/><text x="487" y="37">v5</text>
  </g>
  <path d="M165 375 H565" class="flow"/>
  <text x="350" y="425" text-anchor="middle" class="sans label">repeatable community-detection schedule</text>

  <rect x="745" y="150" width="610" height="315" rx="9" fill="#EDF5FF" stroke="#27313A" stroke-width="3"/>
  <text x="1050" y="195" text-anchor="middle" class="sans heading">cd_parallel</text>
  <text x="1050" y="230" text-anchor="middle" class="sans body">multiple workers process different vertices</text>

  <g class="sans label">
    <text x="790" y="280">T0</text>
    <rect x="845" y="245" width="220" height="55" rx="8" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/>
    <text x="955" y="280" text-anchor="middle">v0, v3</text>
    <text x="790" y="345">T1</text>
    <rect x="845" y="310" width="220" height="55" rx="8" fill="#E7F7EA" stroke="#27313A" stroke-width="2"/>
    <text x="955" y="345" text-anchor="middle">v1, v4</text>
    <text x="790" y="410">T2</text>
    <rect x="845" y="375" width="220" height="55" rx="8" fill="#EEE9FF" stroke="#27313A" stroke-width="2"/>
    <text x="955" y="410" text-anchor="middle">v2, v5</text>
  </g>
  <text x="1185" y="345" text-anchor="middle" class="sans label">workers advance</text>
  <text x="1185" y="378" text-anchor="middle" class="sans label">concurrently</text>
  <text x="1185" y="411" text-anchor="middle" class="sans label">commit order can differ</text>
  </g>

  <rect x="125" y="515" width="1150" height="75" rx="8" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="700" y="546" text-anchor="middle" class="sans body">A deterministic branch choice does not imply a byte-identical parallel mapping.</text>
  <text x="700" y="576" text-anchor="middle" class="sans body">Record mapping fingerprints and repeat schedule-sensitive builds.</text>
</svg>
