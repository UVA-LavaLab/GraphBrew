<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc">
  <title id="title">cd_parallel execution</title>
  <desc id="desc">Serial community detection processes one move stream. cd_parallel distributes work across OpenMP lanes. The policy decision remains deterministic while the resulting mapping can be schedule-sensitive.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M0 0 L12 5 L0 10 Z" fill="#F7941D"/>
    </marker>
    <style>
      .sans{font-family:Arial,Helvetica,sans-serif}
      .title{font-size:40px;font-weight:700;fill:#17212B}
      .subtitle{font-size:22px;fill:#4B5560}
      .heading{font-size:28px;font-weight:700;fill:#17212B}
      .body{font-size:22px;fill:#27313A}
      .label{font-size:20px;font-weight:700;fill:#27313A}
      .flow{fill:none;stroke:#F7941D;stroke-width:5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="600" fill="#FFFFFF"/>
  <text x="45" y="55" class="sans title">cd_parallel: use the OpenMP thread team for Leiden</text>
  <text x="45" y="88" class="sans subtitle">It changes execution schedule, not the frozen selector decision.</text>
  <line x1="45" y1="112" x2="1355" y2="112" stroke="#17212B" stroke-width="2"/>

  <rect x="45" y="150" width="610" height="315" rx="14" fill="#FFF8EB" stroke="#F7941D" stroke-width="4"/>
  <text x="350" y="195" text-anchor="middle" class="sans heading">cd_serial</text>
  <text x="350" y="230" text-anchor="middle" class="sans body">one worker, one ordered move stream</text>
  <g transform="translate(90 285)" class="sans label" text-anchor="middle">
    <rect x="0" y="0" width="75" height="58" rx="8" fill="#FFE8A6" stroke="#17212B" stroke-width="2"/><text x="37" y="37">v0</text>
    <rect x="90" y="0" width="75" height="58" rx="8" fill="#FFD870" stroke="#17212B" stroke-width="2"/><text x="127" y="37">v1</text>
    <rect x="180" y="0" width="75" height="58" rx="8" fill="#FFC13A" stroke="#17212B" stroke-width="2"/><text x="217" y="37">v2</text>
    <rect x="270" y="0" width="75" height="58" rx="8" fill="#B9DEF2" stroke="#17212B" stroke-width="2"/><text x="307" y="37">v3</text>
    <rect x="360" y="0" width="75" height="58" rx="8" fill="#83C7E8" stroke="#17212B" stroke-width="2"/><text x="397" y="37">v4</text>
    <rect x="450" y="0" width="75" height="58" rx="8" fill="#49A9D7" stroke="#17212B" stroke-width="2"/><text x="487" y="37">v5</text>
  </g>
  <path d="M165 375 H565" class="flow"/>
  <text x="350" y="425" text-anchor="middle" class="sans label">repeatable community-detection schedule</text>

  <rect x="745" y="150" width="610" height="315" rx="14" fill="#EEF6FC" stroke="#1683BD" stroke-width="4"/>
  <text x="1050" y="195" text-anchor="middle" class="sans heading">cd_parallel</text>
  <text x="1050" y="230" text-anchor="middle" class="sans body">multiple workers process different vertices</text>

  <g class="sans label">
    <text x="790" y="280">T0</text>
    <rect x="845" y="245" width="220" height="55" rx="8" fill="#FFF3DB" stroke="#F7941D" stroke-width="2"/>
    <text x="955" y="280" text-anchor="middle">v0, v3</text>
    <text x="790" y="345">T1</text>
    <rect x="845" y="310" width="220" height="55" rx="8" fill="#EAF7F3" stroke="#189D85" stroke-width="2"/>
    <text x="955" y="345" text-anchor="middle">v1, v4</text>
    <text x="790" y="410">T2</text>
    <rect x="845" y="375" width="220" height="55" rx="8" fill="#EEF6FC" stroke="#1683BD" stroke-width="2"/>
    <text x="955" y="410" text-anchor="middle">v2, v5</text>
  </g>
  <text x="1185" y="345" text-anchor="middle" class="sans label">workers advance</text>
  <text x="1185" y="378" text-anchor="middle" class="sans label">concurrently</text>
  <text x="1185" y="411" text-anchor="middle" class="sans label">commit order can differ</text>

  <rect x="170" y="505" width="1060" height="65" rx="12" fill="#F8FAFB" stroke="#17212B" stroke-width="3"/>
  <text x="700" y="546" text-anchor="middle" class="sans body">Deterministic branch choice != byte-identical parallel mapping; record fingerprints and repeated draws.</text>
</svg>
