<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc" fill="#27313A">
  <title id="title">GraphBrew relabeling example</title>
  <desc id="desc">The same graph edges are shown before and after relabeling. The larger blue community receives the first contiguous ID block and the smaller orange community receives the second block.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M0 0 L12 5 L0 10 Z" fill="#1769C2"/>
    </marker>
    <style>
      :root{color-scheme:light dark}
      @media(prefers-color-scheme:dark){
        [fill="#27313A"]{fill:#ECE7DD}[stroke="#27313A"]{stroke:#ECE7DD}
        [fill="#F8F6EC"]{fill:#252A2E}[fill="#EDF5FF"]{fill:#273846}
        [fill="#E7F7EA"]{fill:#24382A}[fill="#FFF0D8"]{fill:#3B3122}
        [fill="#F7DEDC"]{fill:#3D292A}[fill="#EEE9FF"]{fill:#302C3C}
        [stroke="#9AA3AD"]{stroke:#747D86}
      }
      .sans{font-family:Arial,Helvetica,sans-serif}
      .title{font-size:40px;font-weight:700}.subtitle{font-size:22px}
      .domain{font-size:20px;font-weight:700;letter-spacing:1.3px}
      .heading{font-size:28px;font-weight:700}.body{font-size:22px}
      .label{font-size:22px;font-weight:700}
      .node{stroke:#27313A;stroke-width:3}
      .edge{stroke:#747D86;stroke-width:6}
      .flow{fill:none;stroke:#1769C2;stroke-width:5;marker-end:url(#arrow)}
    </style>
  </defs>

  <text x="45" y="55" class="sans title">Same graph, new vertex IDs</text>
  <text x="45" y="88" class="sans subtitle">GraphBrew changes label placement and CSR order; every edge remains unchanged.</text>
  <line x1="45" y1="112" x2="1355" y2="112" stroke="#27313A" stroke-width="2"/>

  <rect x="35" y="135" width="1330" height="410" rx="12" fill="none" stroke="#9AA3AD" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="52" y="162" class="sans domain">RELABELING</text>
  <text x="330" y="182" text-anchor="middle" class="sans heading">Input labeling</text>
  <text x="1070" y="182" text-anchor="middle" class="sans heading">GraphBrew labeling</text>
  <path d="M600 175 H800" class="flow"/>
  <rect x="635" y="151" width="130" height="38" fill="#F8F6EC"/>
  <text x="700" y="178" text-anchor="middle" class="sans label">same edges</text>

  <circle cx="230" cy="315" r="125" fill="none" stroke="#C58A28" stroke-width="7" stroke-dasharray="3 14"/>
  <circle cx="435" cy="315" r="155" fill="none" stroke="#1769C2" stroke-width="7" stroke-dasharray="3 14"/>
  <line x1="180" y1="280" x2="250" y2="225" class="edge"/>
  <line x1="180" y1="280" x2="250" y2="380" class="edge"/>
  <line x1="250" y1="225" x2="300" y2="310" class="edge"/>
  <line x1="250" y1="380" x2="300" y2="310" class="edge"/>
  <line x1="300" y1="310" x2="390" y2="260" class="edge"/>
  <line x1="300" y1="310" x2="410" y2="370" class="edge"/>
  <line x1="390" y1="260" x2="480" y2="220" class="edge"/>
  <line x1="390" y1="260" x2="525" y2="315" class="edge"/>
  <line x1="410" y1="370" x2="500" y2="405" class="edge"/>
  <line x1="525" y1="315" x2="500" y2="405" class="edge"/>

  <g class="sans body" text-anchor="middle">
    <circle cx="180" cy="280" r="27" fill="#FFF0D8" class="node"/><text x="180" y="288">2</text>
    <circle cx="250" cy="225" r="27" fill="#FFF0D8" class="node"/><text x="250" y="233">6</text>
    <circle cx="250" cy="380" r="27" fill="#FFF0D8" class="node"/><text x="250" y="388">4</text>
    <circle cx="300" cy="310" r="30" fill="#F7DEDC" class="node"/><text x="300" y="318">1</text>
    <circle cx="390" cy="260" r="30" fill="#E7F7EA" class="node"/><text x="390" y="268">0</text>
    <circle cx="410" cy="370" r="27" fill="#EDF5FF" class="node"/><text x="410" y="378">7</text>
    <circle cx="480" cy="220" r="27" fill="#EDF5FF" class="node"/><text x="480" y="228">3</text>
    <circle cx="525" cy="315" r="27" fill="#EDF5FF" class="node"/><text x="525" y="323">5</text>
    <circle cx="500" cy="405" r="27" fill="#EDF5FF" class="node"/><text x="500" y="413">8</text>
  </g>

  <circle cx="970" cy="315" r="125" fill="none" stroke="#C58A28" stroke-width="7" stroke-dasharray="3 14"/>
  <circle cx="1175" cy="315" r="155" fill="none" stroke="#1769C2" stroke-width="7" stroke-dasharray="3 14"/>
  <line x1="920" y1="280" x2="990" y2="225" class="edge"/>
  <line x1="920" y1="280" x2="990" y2="380" class="edge"/>
  <line x1="990" y1="225" x2="1040" y2="310" class="edge"/>
  <line x1="990" y1="380" x2="1040" y2="310" class="edge"/>
  <line x1="1040" y1="310" x2="1130" y2="260" class="edge"/>
  <line x1="1040" y1="310" x2="1150" y2="370" class="edge"/>
  <line x1="1130" y1="260" x2="1220" y2="220" class="edge"/>
  <line x1="1130" y1="260" x2="1265" y2="315" class="edge"/>
  <line x1="1150" y1="370" x2="1240" y2="405" class="edge"/>
  <line x1="1265" y1="315" x2="1240" y2="405" class="edge"/>

  <g class="sans body" text-anchor="middle">
    <circle cx="920" cy="280" r="27" fill="#FFF0D8" class="node"/><text x="920" y="288">6</text>
    <circle cx="990" cy="225" r="27" fill="#FFF0D8" class="node"/><text x="990" y="233">7</text>
    <circle cx="990" cy="380" r="27" fill="#FFF0D8" class="node"/><text x="990" y="388">8</text>
    <circle cx="1040" cy="310" r="30" fill="#F7DEDC" class="node"/><text x="1040" y="318">5</text>
    <circle cx="1130" cy="260" r="30" fill="#E7F7EA" class="node"/><text x="1130" y="268">0</text>
    <circle cx="1150" cy="370" r="27" fill="#EDF5FF" class="node"/><text x="1150" y="378">1</text>
    <circle cx="1220" cy="220" r="27" fill="#EDF5FF" class="node"/><text x="1220" y="228">2</text>
    <circle cx="1265" cy="315" r="27" fill="#EDF5FF" class="node"/><text x="1265" y="323">3</text>
    <circle cx="1240" cy="405" r="27" fill="#EDF5FF" class="node"/><text x="1240" y="413">4</text>
  </g>

  <text x="230" y="480" text-anchor="middle" class="sans label">small block</text>
  <text x="435" y="510" text-anchor="middle" class="sans label">large block</text>
  <text x="970" y="480" text-anchor="middle" class="sans label">Gorder8: IDs 5-8</text>
  <text x="1175" y="510" text-anchor="middle" class="sans label">BFS: IDs 0-4</text>

  <rect x="35" y="565" width="1330" height="235" rx="12" fill="none" stroke="#9AA3AD" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="52" y="592" class="sans domain">MEMORY LAYOUT</text>
  <text x="70" y="645" class="sans label">Input</text>
  <g transform="translate(210 610)" class="sans body" text-anchor="middle">
    <rect x="0" y="0" width="105" height="58" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/><text x="52" y="38">0</text>
    <rect x="105" y="0" width="105" height="58" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/><text x="157" y="38">1</text>
    <rect x="210" y="0" width="105" height="58" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/><text x="262" y="38">2</text>
    <rect x="315" y="0" width="105" height="58" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/><text x="367" y="38">3</text>
    <rect x="420" y="0" width="105" height="58" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/><text x="472" y="38">4</text>
    <rect x="525" y="0" width="105" height="58" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/><text x="577" y="38">5</text>
    <rect x="630" y="0" width="105" height="58" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/><text x="682" y="38">6</text>
    <rect x="735" y="0" width="105" height="58" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/><text x="787" y="38">7</text>
    <rect x="840" y="0" width="105" height="58" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/><text x="892" y="38">8</text>
  </g>

  <text x="70" y="750" class="sans label">Output</text>
  <g transform="translate(210 715)" class="sans body" text-anchor="middle">
    <rect x="0" y="0" width="105" height="58" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/><text x="52" y="38">0</text>
    <rect x="105" y="0" width="105" height="58" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/><text x="157" y="38">1</text>
    <rect x="210" y="0" width="105" height="58" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/><text x="262" y="38">2</text>
    <rect x="315" y="0" width="105" height="58" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/><text x="367" y="38">3</text>
    <rect x="420" y="0" width="105" height="58" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/><text x="472" y="38">4</text>
    <rect x="525" y="0" width="105" height="58" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/><text x="577" y="38">5</text>
    <rect x="630" y="0" width="105" height="58" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/><text x="682" y="38">6</text>
    <rect x="735" y="0" width="105" height="58" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/><text x="787" y="38">7</text>
    <rect x="840" y="0" width="105" height="58" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/><text x="892" y="38">8</text>
  </g>
  <line x1="210" y1="792" x2="735" y2="792" stroke="#1769C2" stroke-width="7"/>
  <line x1="735" y1="792" x2="1155" y2="792" stroke="#C58A28" stroke-width="7"/>
</svg>
