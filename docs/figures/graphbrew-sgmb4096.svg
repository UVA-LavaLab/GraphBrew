<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc" fill="#27313A">
  <title id="title">sgmb4096 execution</title>
  <desc id="desc">Internal Leiden community super-nodes are grouped into a proposal batch. Proposals are computed in parallel from the same pre-commit state, then committed in super-node order.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="9" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 Z" fill="#1769C2"/>
    </marker>
    <style>
      :root{color-scheme:light dark}
      @media(prefers-color-scheme:dark){
        [fill="#FFFFFF"]{fill:#1E2327}
        [fill="#27313A"]{fill:#ECE7DD}[stroke="#27313A"]{stroke:#ECE7DD}
        [fill="#F8F6EC"]{fill:#252A2E}[fill="#EDF5FF"]{fill:#273846}
        [fill="#E7F7EA"]{fill:#24382A}[fill="#FFF0D8"]{fill:#3B3122}
        [fill="#F7DEDC"]{fill:#3D292A}[fill="#EEE9FF"]{fill:#302C3C}
        [stroke="#9AA3AD"]{stroke:#747D86}
      }
      .sans{font-family:Arial,Helvetica,sans-serif}
      .title{font-size:44px;font-weight:700}.subtitle{font-size:24px}
      .domain{font-size:21px;font-weight:700;letter-spacing:1.3px}
      .heading{font-size:31px;font-weight:700}.body{font-size:24px}
      .label{font-size:22px;font-weight:700}
      .edge{stroke:#747D86;stroke-width:3.5}
      .flow{fill:none;stroke:#1769C2;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="620" fill="#FFFFFF"/>
  <text x="45" y="55" class="sans title">sgmb4096: parallel proposals, ordered commits</text>
  <text x="45" y="88" class="sans subtitle">The batch contains community super-nodes inside Leiden, not original graph vertices.</text>
  <line x1="45" y1="112" x2="1355" y2="112" stroke="#27313A" stroke-width="2"/>

  <rect x="35" y="135" width="1330" height="465" rx="12" fill="none" stroke="#9AA3AD" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="52" y="162" class="sans domain">INTERNAL LEIDEN SUPER-GRAPH</text>
  <text x="700" y="188" text-anchor="middle" class="sans heading">Current communities become super-nodes</text>
  <g transform="translate(210 210)" class="sans label" text-anchor="middle">
    <line x1="60" y1="70" x2="180" y2="25" class="edge"/>
    <line x1="180" y1="25" x2="300" y2="75" class="edge"/>
    <line x1="300" y1="75" x2="420" y2="25" class="edge"/>
    <line x1="420" y1="25" x2="540" y2="75" class="edge"/>
    <line x1="540" y1="75" x2="660" y2="25" class="edge"/>
    <line x1="660" y1="25" x2="780" y2="75" class="edge"/>
    <line x1="780" y1="75" x2="900" y2="25" class="edge"/>
    <circle cx="60" cy="70" r="30" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/><text x="60" y="77">C0</text>
    <circle cx="180" cy="25" r="30" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/><text x="180" y="32">C1</text>
    <circle cx="300" cy="75" r="30" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/><text x="300" y="82">C2</text>
    <circle cx="420" cy="25" r="30" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/><text x="420" y="32">C3</text>
    <circle cx="540" cy="75" r="30" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/><text x="540" y="82">C4</text>
    <circle cx="660" cy="25" r="30" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/><text x="660" y="32">C5</text>
    <circle cx="780" cy="75" r="30" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/><text x="780" y="82">C6</text>
    <circle cx="900" cy="25" r="30" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/><text x="900" y="32">C7</text>
  </g>

  <rect x="165" y="340" width="1070" height="95" rx="9" fill="#EDF5FF" stroke="#27313A" stroke-width="3"/>
  <text x="700" y="375" text-anchor="middle" class="sans heading">1. Proposal phase</text>
  <text x="700" y="412" text-anchor="middle" class="sans body">up to 4,096 super-nodes compute moves in parallel from the same pre-commit state</text>

  <path d="M700 435 V470" class="flow"/>

  <text x="700" y="510" text-anchor="middle" class="sans heading">2. Ordered commit</text>
  <g transform="translate(250 530)" class="sans label" text-anchor="middle">
    <rect x="0" y="0" width="112" height="58" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/><text x="56" y="37">C0</text>
    <rect x="112" y="0" width="112" height="58" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/><text x="168" y="37">C1</text>
    <rect x="224" y="0" width="112" height="58" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/><text x="280" y="37">C2</text>
    <rect x="336" y="0" width="112" height="58" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/><text x="392" y="37">C3</text>
    <rect x="448" y="0" width="112" height="58" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/><text x="504" y="37">C4</text>
    <rect x="560" y="0" width="112" height="58" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/><text x="616" y="37">C5</text>
    <rect x="672" y="0" width="112" height="58" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/><text x="728" y="37">C6</text>
    <rect x="784" y="0" width="112" height="58" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/><text x="840" y="37">C7</text>
  </g>
</svg>
