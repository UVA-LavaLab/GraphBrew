<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">sgmb4096 execution</title>
  <desc id="desc">Internal Leiden community super-nodes are grouped into a proposal batch. Proposals are computed in parallel from the same pre-commit state, then committed in super-node order.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M0 0 L12 5 L0 10 Z" fill="#1683BD"/>
    </marker>
    <style>
      .sans{font-family:Arial,Helvetica,sans-serif}
      .title{font-size:40px;font-weight:700;fill:#17212B}
      .subtitle{font-size:22px;fill:#4B5560}
      .heading{font-size:28px;font-weight:700;fill:#17212B}
      .body{font-size:22px;fill:#27313A}
      .label{font-size:20px;font-weight:700;fill:#27313A}
      .edge{stroke:#6B7075;stroke-width:5}
      .flow{fill:none;stroke:#1683BD;stroke-width:5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="620" fill="#FFFFFF"/>
  <text x="45" y="55" class="sans title">sgmb4096: parallel proposals, ordered commits</text>
  <text x="45" y="88" class="sans subtitle">The batch contains community super-nodes inside Leiden, not original graph vertices.</text>
  <line x1="45" y1="112" x2="1355" y2="112" stroke="#17212B" stroke-width="2"/>

  <text x="700" y="155" text-anchor="middle" class="sans heading">Internal community super-graph</text>
  <g transform="translate(210 180)" class="sans label" text-anchor="middle">
    <line x1="60" y1="70" x2="180" y2="25" class="edge"/>
    <line x1="180" y1="25" x2="300" y2="75" class="edge"/>
    <line x1="300" y1="75" x2="420" y2="25" class="edge"/>
    <line x1="420" y1="25" x2="540" y2="75" class="edge"/>
    <line x1="540" y1="75" x2="660" y2="25" class="edge"/>
    <line x1="660" y1="25" x2="780" y2="75" class="edge"/>
    <line x1="780" y1="75" x2="900" y2="25" class="edge"/>
    <circle cx="60" cy="70" r="30" fill="#F7941D" stroke="#17212B" stroke-width="2"/><text x="60" y="77">C0</text>
    <circle cx="180" cy="25" r="30" fill="#FFC13A" stroke="#17212B" stroke-width="2"/><text x="180" y="32">C1</text>
    <circle cx="300" cy="75" r="30" fill="#FFD870" stroke="#17212B" stroke-width="2"/><text x="300" y="82">C2</text>
    <circle cx="420" cy="25" r="30" fill="#FFE8A6" stroke="#17212B" stroke-width="2"/><text x="420" y="32">C3</text>
    <circle cx="540" cy="75" r="30" fill="#1683BD" stroke="#17212B" stroke-width="2"/><text x="540" y="82">C4</text>
    <circle cx="660" cy="25" r="30" fill="#49A9D7" stroke="#17212B" stroke-width="2"/><text x="660" y="32">C5</text>
    <circle cx="780" cy="75" r="30" fill="#83C7E8" stroke="#17212B" stroke-width="2"/><text x="780" y="82">C6</text>
    <circle cx="900" cy="25" r="30" fill="#B9DEF2" stroke="#17212B" stroke-width="2"/><text x="900" y="32">C7</text>
  </g>

  <rect x="165" y="310" width="1070" height="95" rx="14" fill="#EEF6FC" stroke="#1683BD" stroke-width="3"/>
  <text x="700" y="345" text-anchor="middle" class="sans heading">1. Proposal phase</text>
  <text x="700" y="382" text-anchor="middle" class="sans body">up to 4,096 super-nodes compute moves in parallel from the same pre-commit state</text>

  <path d="M700 405 V450" class="flow"/>

  <text x="700" y="478" text-anchor="middle" class="sans heading">2. Ordered commit</text>
  <g transform="translate(250 500)" class="sans label" text-anchor="middle">
    <rect x="0" y="0" width="112" height="58" fill="#F7941D" stroke="#17212B" stroke-width="2"/><text x="56" y="37">C0</text>
    <rect x="112" y="0" width="112" height="58" fill="#FFC13A" stroke="#17212B" stroke-width="2"/><text x="168" y="37">C1</text>
    <rect x="224" y="0" width="112" height="58" fill="#FFD870" stroke="#17212B" stroke-width="2"/><text x="280" y="37">C2</text>
    <rect x="336" y="0" width="112" height="58" fill="#FFE8A6" stroke="#17212B" stroke-width="2"/><text x="392" y="37">C3</text>
    <rect x="448" y="0" width="112" height="58" fill="#1683BD" stroke="#17212B" stroke-width="2"/><text x="504" y="37">C4</text>
    <rect x="560" y="0" width="112" height="58" fill="#49A9D7" stroke="#17212B" stroke-width="2"/><text x="616" y="37">C5</text>
    <rect x="672" y="0" width="112" height="58" fill="#83C7E8" stroke="#17212B" stroke-width="2"/><text x="728" y="37">C6</text>
    <rect x="784" y="0" width="112" height="58" fill="#B9DEF2" stroke="#17212B" stroke-width="2"/><text x="840" y="37">C7</text>
  </g>
  <text x="700" y="598" text-anchor="middle" class="sans body">sgmb1 is the sequential control; sg_none is a separate final block-layout choice.</text>
</svg>
