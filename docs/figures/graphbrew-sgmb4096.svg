<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc" fill="#27313A">
  <title id="title">Control: sgmb4096 batches proposals but commits them in order</title>
  <desc id="desc">The batch contains community super-nodes, not original graph vertices.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 Z" fill="#1769C2"/>
    </marker>
    <style>
      :root{color-scheme:light dark}
      @media(prefers-color-scheme:dark){
        [fill="#27313A"]{fill:#ECE7DD}[stroke="#27313A"]{stroke:#ECE7DD}
        [fill="#FFFFFF"]{fill:#1E2327}[fill="#F8F6EC"]{fill:#252A2E}
        [fill="#EDF5FF"]{fill:#273846}[fill="#E7F7EA"]{fill:#24382A}
        [fill="#FFF0D8"]{fill:#3B3122}[fill="#F7DEDC"]{fill:#3D292A}
        [fill="#EEE9FF"]{fill:#302C3C}[stroke="#9AA3AD"]{stroke:#747D86}
        [stroke="#1769C2"]{stroke:#63A8FF}[fill="#1769C2"]{fill:#63A8FF}
        .arrow{stroke:#63A8FF!important}.edge{stroke:#ECE7DD!important}
      }
      .sans{font-family:Arial,Helvetica,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,monospace}
      .title{font-size:32px;font-weight:700}.subtitle{font-size:18px}
      .domain{font-size:16px;font-weight:700;letter-spacing:1.2px}.heading{font-size:22px;font-weight:700}
      .label{font-size:18px;font-weight:700}.body{font-size:17px}.small{font-size:16px}
      .arrow{fill:none;stroke:#1769C2;stroke-width:3;marker-end:url(#arrow)}
      .edge{stroke:#27313A;stroke-width:2.2}
    </style>
  </defs>
  <rect width="1200" height="520" fill="#FFFFFF"/>
  <text x="42" y="47" class="sans title">Control: sgmb4096 batches proposals but commits them in order</text>
  <text x="42" y="75" class="sans subtitle">Illustrative C0/C1 supergraph derived from the same running example.</text>
  <line x1="42" y1="99" x2="1158" y2="99" stroke="#27313A" stroke-width="2"/>
  <rect x="25" y="112" width="1150" height="315" rx="12" fill="none" stroke="#9AA3AD" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="35" y="125" width="1130" height="105" rx="10" fill="#EEE9FF" stroke="#27313A" stroke-width="3"/>
  <text x="60" y="160" class="sans heading">Community supergraph</text>
  <circle cx="310" cy="182" r="25" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/>
  <text x="310" y="188" class="sans label" text-anchor="middle">C0</text>
  <circle cx="890" cy="182" r="25" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/>
  <text x="890" y="188" class="sans label" text-anchor="middle">C1</text>
  <line x1="337" y1="182" x2="863" y2="182" stroke="#1769C2" stroke-width="4"/>
  <text x="600" y="174" class="mono small" text-anchor="middle">cross edges: (v8,v1), (v8,v2)</text>
  <rect x="35" y="270" width="520" height="145" rx="10" fill="#EDF5FF" stroke="#27313A" stroke-width="3"/>
  <text x="60" y="305" class="sans heading">1. Proposal phase</text>
  <text x="60" y="340" class="mono body">batch = [C0, C1]</text>
  <text x="60" y="372" class="sans body">Workers evaluate from one pre-commit state.</text>
  <rect x="645" y="270" width="520" height="145" rx="10" fill="#E7F7EA" stroke="#27313A" stroke-width="3"/>
  <text x="670" y="305" class="sans heading">2. Ordered commit</text>
  <rect x="670.00" y="330" width="235.00" height="42" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="787" y="356" class="mono small" text-anchor="middle">C0</text>
  <rect x="905.00" y="330" width="235.00" height="42" fill="#FFF0D8" stroke="#27313A" stroke-width="1.5"/>
  <text x="1022" y="356" class="mono small" text-anchor="middle">C1</text>
  <text x="670" y="395" class="sans body">Commit order is deterministic within the batch.</text>
  <path d="M555 342 H641" class="arrow"/>
  <rect x="144" y="445" width="912" height="44" rx="9" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="600" y="472" class="sans small" text-anchor="middle">Invariant: sgmb changes proposal batching, not the requested partition/layout recipe.</text>
</svg>
