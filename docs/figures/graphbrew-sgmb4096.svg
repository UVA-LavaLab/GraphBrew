<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc" fill="#27313A" data-figure-schema="graphbrew-public/v4">
  <title id="title">Control B: sgmb4096 batches proposals but commits them in order</title>
  <desc id="desc">Illustrative singleton supernodes use adjacent targets from the running graph; they are not measured modularity winners.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 Z" fill="#1769C2"/>
    </marker>
    <style>
      :root{color-scheme:light dark}
      @media(prefers-color-scheme:dark){
        [fill="#27313A"]{fill:#ECE7DD}[stroke="#27313A"]{stroke:#ECE7DD}
        [fill="#FFFFFF"]{fill:#1E2327}[fill="#F8F6EC"]{fill:#252A2E}
        [fill="#EDF5FF"]{fill:#273846}[fill="#E7F7EA"]{fill:#24382A}
        [fill="#FFF0D8"]{fill:#3B3122}[fill="#F7DEDC"]{fill:#3D292A}
        [fill="#EEE9FF"]{fill:#302C3C}[stroke="#9AA3AD"]{stroke:#747D86}
        [stroke="#1769C2"]{stroke:#63A8FF}[fill="#1769C2"]{fill:#63A8FF}
        [stroke="#B45309"]{stroke:#F0B35A}[stroke="#15803D"]{stroke:#63D68B}
        .arrow{stroke:#63A8FF!important}.edge{stroke:#ECE7DD!important}
      }
      .sans{font-family:Arial,Helvetica,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,monospace}
      .title{font-size:32px;font-weight:700}.subtitle{font-size:18px}
      .domain{font-size:16px;font-weight:700;letter-spacing:1.2px}.heading{font-size:22px;font-weight:700}
      .label{font-size:18px;font-weight:700}.body{font-size:17px}.small{font-size:16px}.micro{font-size:14px;font-weight:700}
      .arrow{fill:none;stroke:#1769C2;stroke-width:3;marker-end:url(#arrow)}
      .edge{stroke:#27313A;stroke-width:2.2}
    </style>
  </defs>
  <rect width="1200" height="520" fill="#FFFFFF"/>
  <text x="42" y="47" class="sans title">Control B: sgmb4096 batches proposals but commits them in order</text>
  <text x="42" y="75" class="sans subtitle">The production value 4096 is a batch cap; this readable example uses four supernodes.</text>
  <line x1="42" y1="99" x2="1158" y2="99" stroke="#27313A" stroke-width="2"/>
  <rect x="25" y="112" width="1150" height="315" rx="12" fill="none" stroke="#9AA3AD" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="35" y="125" width="1130" height="85" rx="10" fill="#F8F6EC" stroke="#EEE9FF" stroke-width="2"/>
  <text x="60" y="158" class="sans heading">Readable proposal batch</text>
  <rect x="360.00" y="140" width="190.00" height="48" fill="#FFFFFF" stroke="#27313A" stroke-width="1.5"/>
  <text x="455" y="169" class="mono small" text-anchor="middle">S0=v0</text>
  <rect x="550.00" y="140" width="190.00" height="48" fill="#FFFFFF" stroke="#27313A" stroke-width="1.5"/>
  <text x="645" y="169" class="mono small" text-anchor="middle">S1=v1</text>
  <rect x="740.00" y="140" width="190.00" height="48" fill="#E7F7EA" stroke="#1769C2" stroke-width="3"/>
  <text x="835" y="169" class="mono small" text-anchor="middle">S2=v2</text>
  <rect x="930.00" y="140" width="190.00" height="48" fill="#FFFFFF" stroke="#27313A" stroke-width="1.5"/>
  <text x="1025" y="169" class="mono small" text-anchor="middle">S3=v3</text>
  <rect x="35" y="245" width="520" height="170" rx="10" fill="#FFFFFF" stroke="#1769C2" stroke-width="2"/>
  <text x="60" y="280" class="sans heading">1. Parallel proposal phase</text>
  <text x="60" y="312" class="mono small">S0(v0) -&gt; S3(v3)</text>
  <text x="60" y="340" class="mono small">S1(v1) -&gt; S2(v2)</text>
  <text x="60" y="368" class="mono small">S2(v2) -&gt; keep</text>
  <text x="60" y="396" class="mono small">S3(v3) -&gt; S8(v8)</text>
  <rect x="645" y="245" width="520" height="170" rx="10" fill="#FFFFFF" stroke="#E7F7EA" stroke-width="2"/>
  <text x="670" y="280" class="sans heading">2. Ordered commit by supernode ID</text>
  <rect x="670.00" y="305" width="117.50" height="44" fill="#F8F6EC" stroke="#27313A" stroke-width="1.5"/>
  <text x="728" y="332" class="mono small" text-anchor="middle">S0</text>
  <rect x="787.50" y="305" width="117.50" height="44" fill="#F8F6EC" stroke="#27313A" stroke-width="1.5"/>
  <text x="846" y="332" class="mono small" text-anchor="middle">S1</text>
  <rect x="905.00" y="305" width="117.50" height="44" fill="#E7F7EA" stroke="#1769C2" stroke-width="3"/>
  <text x="963" y="332" class="mono small" text-anchor="middle">S2</text>
  <rect x="1022.50" y="305" width="117.50" height="44" fill="#F8F6EC" stroke="#27313A" stroke-width="1.5"/>
  <text x="1081" y="332" class="mono small" text-anchor="middle">S3</text>
  <rect x="670.00" y="355" width="117.50" height="44" fill="#EEE9FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="728" y="382" class="mono small" text-anchor="middle">S3</text>
  <rect x="787.50" y="355" width="117.50" height="44" fill="#EEE9FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="846" y="382" class="mono small" text-anchor="middle">S2</text>
  <rect x="905.00" y="355" width="117.50" height="44" fill="#E7F7EA" stroke="#1769C2" stroke-width="3"/>
  <text x="963" y="382" class="mono small" text-anchor="middle">keep</text>
  <rect x="1022.50" y="355" width="117.50" height="44" fill="#EEE9FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="1081" y="382" class="mono small" text-anchor="middle">S8</text>
  <path d="M555 330 H641" class="arrow"/>
  <rect x="144" y="445" width="912" height="44" rx="9" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="600" y="472" class="sans small" text-anchor="middle">Invariant: sgmb changes proposal batching, not the requested partition/layout recipe.</text>
</svg>
