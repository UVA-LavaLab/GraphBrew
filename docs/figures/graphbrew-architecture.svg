<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc" fill="#27313A">
  <title id="title">GraphBrew: current system and Rabbit-free research direction</title>
  <desc id="desc">The validated low-reuse selector and proposed Rabbit-free generator share one six-stage composition pipeline and one tracked vertex.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 Z" fill="#1769C2"/>
    </marker>
    <style>
      :root{color-scheme:light dark}
      @media(prefers-color-scheme:dark){
        [fill="#27313A"]{fill:#ECE7DD}[stroke="#27313A"]{stroke:#ECE7DD}
        [fill="#FFFFFF"]{fill:#1E2327}[fill="#F8F6EC"]{fill:#252A2E}
        [fill="#EDF5FF"]{fill:#273846}[fill="#E7F7EA"]{fill:#24382A}
        [fill="#FFF0D8"]{fill:#3B3122}[fill="#F7DEDC"]{fill:#3D292A}
        [fill="#EEE9FF"]{fill:#302C3C}[stroke="#9AA3AD"]{stroke:#747D86}
        [stroke="#1769C2"]{stroke:#63A8FF}[fill="#1769C2"]{fill:#63A8FF}
        .arrow{stroke:#63A8FF!important}.edge{stroke:#ECE7DD!important}
      }
      .sans{font-family:Arial,Helvetica,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,monospace}
      .title{font-size:32px;font-weight:700}.subtitle{font-size:18px}
      .domain{font-size:16px;font-weight:700;letter-spacing:1.2px}.heading{font-size:22px;font-weight:700}
      .label{font-size:18px;font-weight:700}.body{font-size:17px}.small{font-size:16px}
      .arrow{fill:none;stroke:#1769C2;stroke-width:3;marker-end:url(#arrow)}
      .edge{stroke:#27313A;stroke-width:2.2}
    </style>
  </defs>
  <rect width="1200" height="690" fill="#FFFFFF"/>
  <text x="42" y="47" class="sans title">GraphBrew: current system and Rabbit-free research direction</text>
  <text x="42" y="75" class="sans subtitle">Running example: follow v2 from input CSR to new ID 0 and 3 cache lines -&gt; 2.</text>
  <line x1="42" y1="99" x2="1158" y2="99" stroke="#27313A" stroke-width="2"/>
  <rect x="35" y="118" width="545" height="76" rx="10" fill="#EDF5FF" stroke="#27313A" stroke-width="3"/>
  <text x="60" y="147" class="sans domain">CURRENT VALIDATED PATH</text>
  <text x="60" y="174" class="sans body">Explicit recipes + frozen low-reuse selector</text>
  <rect x="620" y="118" width="545" height="76" rx="10" fill="#EEE9FF" stroke="#27313A" stroke-width="3"/>
  <text x="645" y="147" class="sans domain">PROPOSED RESEARCH PATH</text>
  <text x="645" y="174" class="sans body">Rabbit-free deterministic composition generator</text>
  <rect x="25" y="208" width="1150" height="380" rx="12" fill="none" stroke="#9AA3AD" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="45" y="232" class="sans domain">SHARED SIX-STAGE PIPELINE</text>
  <rect x="35" y="250" width="340" height="155" rx="11" fill="#EDF5FF" stroke="#27313A" stroke-width="3"/>
  <circle cx="65" cy="280" r="17" fill="#27313A" stroke="#27313A" stroke-width="1"/>
  <text x="65" y="286" class="sans label" text-anchor="middle" fill="#FFFFFF">1</text>
  <text x="93" y="287" class="sans heading">Load + profile</text>
  <text x="60" y="325" class="sans body">Read CSR</text>
  <text x="60" y="350" class="sans body">Compute lightweight features</text>
  <rect x="60" y="363" width="290" height="28" rx="6" fill="#FFFFFF" stroke="#27313A" stroke-width="2"/>
  <text x="205" y="382" class="mono small" text-anchor="middle">row v2 = [1,4,6,8]</text>
  <rect x="430" y="250" width="340" height="155" rx="11" fill="#EEE9FF" stroke="#27313A" stroke-width="3"/>
  <circle cx="460" cy="280" r="17" fill="#27313A" stroke="#27313A" stroke-width="1"/>
  <text x="460" y="286" class="sans label" text-anchor="middle" fill="#FFFFFF">2</text>
  <text x="488" y="287" class="sans heading">Partition</text>
  <text x="455" y="325" class="sans body">Assign C0 / C1</text>
  <text x="455" y="350" class="sans body">Keep topology unchanged</text>
  <rect x="455" y="363" width="290" height="28" rx="6" fill="#FFFFFF" stroke="#27313A" stroke-width="2"/>
  <text x="600" y="382" class="mono small" text-anchor="middle">v2 in C0</text>
  <rect x="825" y="250" width="340" height="155" rx="11" fill="#FFF0D8" stroke="#27313A" stroke-width="3"/>
  <circle cx="855" cy="280" r="17" fill="#27313A" stroke="#27313A" stroke-width="1"/>
  <text x="855" y="286" class="sans label" text-anchor="middle" fill="#FFFFFF">3</text>
  <text x="883" y="287" class="sans heading">Block layout</text>
  <text x="850" y="325" class="sans body">SizeDesc: C0 first</text>
  <text x="850" y="350" class="sans body">Reserve contiguous ranges</text>
  <rect x="850" y="363" width="290" height="28" rx="6" fill="#FFFFFF" stroke="#27313A" stroke-width="2"/>
  <text x="995" y="382" class="mono small" text-anchor="middle">C0 -&gt; IDs 0..4</text>
  <rect x="35" y="425" width="340" height="155" rx="11" fill="#EEE9FF" stroke="#27313A" stroke-width="3"/>
  <circle cx="65" cy="455" r="17" fill="#27313A" stroke="#27313A" stroke-width="1"/>
  <text x="65" y="461" class="sans label" text-anchor="middle" fill="#FFFFFF">4</text>
  <text x="93" y="462" class="sans heading">Vertex layout</text>
  <text x="60" y="500" class="sans body">BFS for C0</text>
  <text x="60" y="525" class="sans body">relaxed Gorder for C1</text>
  <rect x="60" y="538" width="290" height="28" rx="6" fill="#FFFFFF" stroke="#27313A" stroke-width="2"/>
  <text x="205" y="557" class="mono small" text-anchor="middle">v2 -&gt; local ID 0</text>
  <rect x="430" y="425" width="340" height="155" rx="11" fill="#E7F7EA" stroke="#27313A" stroke-width="3"/>
  <circle cx="460" cy="455" r="17" fill="#27313A" stroke="#27313A" stroke-width="1"/>
  <text x="460" y="461" class="sans label" text-anchor="middle" fill="#FFFFFF">5</text>
  <text x="488" y="462" class="sans heading">Emit relabeled CSR</text>
  <text x="455" y="500" class="sans body">Compose old -&gt; new IDs</text>
  <text x="455" y="525" class="sans body">Validate permutation</text>
  <rect x="455" y="538" width="290" height="28" rx="6" fill="#FFFFFF" stroke="#27313A" stroke-width="2"/>
  <text x="600" y="557" class="mono small" text-anchor="middle">v2 -&gt; new ID 0</text>
  <rect x="825" y="425" width="340" height="155" rx="11" fill="#E7F7EA" stroke="#27313A" stroke-width="3"/>
  <circle cx="855" cy="455" r="17" fill="#27313A" stroke="#27313A" stroke-width="1"/>
  <text x="855" y="461" class="sans label" text-anchor="middle" fill="#FFFFFF">6</text>
  <text x="883" y="462" class="sans heading">Kernel locality</text>
  <text x="850" y="500" class="sans body">Same neighbors</text>
  <text x="850" y="525" class="sans body">Fewer property cache lines</text>
  <rect x="850" y="538" width="290" height="28" rx="6" fill="#FFFFFF" stroke="#27313A" stroke-width="2"/>
  <text x="995" y="557" class="mono small" text-anchor="middle">v2: 3 lines -&gt; 2</text>
  <path d="M375 327 H426" class="arrow"/>
  <path d="M770 327 H821" class="arrow"/>
  <path d="M995 405 V413 H205 V421" class="arrow"/>
  <path d="M375 502 H426" class="arrow"/>
  <path d="M770 502 H821" class="arrow"/>
  <rect x="144" y="625" width="912" height="44" rx="9" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="600" y="652" class="sans small" text-anchor="middle">Invariant: graph topology and kernel semantics do not change; only vertex IDs and CSR order change.</text>
</svg>
