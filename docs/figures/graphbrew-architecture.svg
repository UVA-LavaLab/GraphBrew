<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">GraphBrew architecture</title>
  <desc id="desc">A graph workload enters either an explicit composition or a frozen low-reuse rule. Both paths execute the same partitioner, block layout, and vertex layout pipeline, then validate the mapping and run graph kernels.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M0 0 L12 5 L0 10 Z" fill="#1683BD"/>
    </marker>
    <style>
      .sans{font-family:Arial,Helvetica,sans-serif}
      .title{font-size:40px;font-weight:700;fill:#17212B}
      .subtitle{font-size:22px;fill:#4B5560}
      .heading{font-size:27px;font-weight:700;fill:#17212B}
      .body{font-size:22px;fill:#27313A}
      .label{font-size:20px;font-weight:700;fill:#27313A}
      .flow{fill:none;stroke:#1683BD;stroke-width:5;marker-end:url(#arrow)}
      .branch{fill:none;stroke:#1683BD;stroke-width:5}
      .card{fill:#FFFFFF;stroke:#17212B;stroke-width:3}
    </style>
  </defs>

  <rect width="1400" height="650" fill="#FFFFFF"/>
  <text x="45" y="55" class="sans title">GraphBrew: compose the layout, then measure the trade-off</text>
  <text x="45" y="88" class="sans subtitle">One ordering pipeline; two ways to choose its configuration.</text>
  <line x1="45" y1="112" x2="1355" y2="112" stroke="#17212B" stroke-width="2"/>

  <rect x="45" y="155" width="230" height="340" rx="14" fill="#EEF6FC" stroke="#1683BD" stroke-width="4"/>
  <text x="160" y="198" text-anchor="middle" class="sans heading">Workload</text>
  <text x="75" y="250" class="sans body">Graph in CSR</text>
  <text x="75" y="295" class="sans body">Kernel</text>
  <text x="75" y="340" class="sans body">CPU / LLC</text>
  <text x="75" y="385" class="sans body">Mapping reuse</text>
  <text x="160" y="455" text-anchor="middle" class="sans label">same topology</text>

  <path d="M275 325 H300" class="branch"/>
  <path d="M300 325 V232 H330" class="flow"/>
  <path d="M300 325 V418 H330" class="flow"/>

  <rect x="330" y="155" width="335" height="155" rx="14" fill="#FFF3DB" stroke="#F7941D" stroke-width="4"/>
  <text x="497" y="198" text-anchor="middle" class="sans heading">Explicit composition</text>
  <text x="497" y="240" text-anchor="middle" class="sans body">User supplies exact stages</text>
  <text x="497" y="278" text-anchor="middle" class="sans label">algorithm 12</text>

  <rect x="330" y="340" width="335" height="155" rx="14" fill="#FCEBEC" stroke="#D62F44" stroke-width="4"/>
  <text x="497" y="383" text-anchor="middle" class="sans heading">Frozen policy</text>
  <text x="497" y="425" text-anchor="middle" class="sans body">Sample features; choose arm</text>
  <text x="497" y="463" text-anchor="middle" class="sans label">algorithm 14</text>

  <path d="M665 232 H720" class="flow"/>
  <path d="M665 418 H720" class="flow"/>

  <rect x="720" y="145" width="390" height="360" rx="14" fill="#F8FAFB" stroke="#17212B" stroke-width="3"/>
  <text x="915" y="188" text-anchor="middle" class="sans heading">Ordering pipeline</text>

  <rect x="755" y="215" width="320" height="72" rx="10" fill="#F3EDFF" stroke="#7B4AA1" stroke-width="3"/>
  <text x="915" y="260" text-anchor="middle" class="sans heading">1. Partitioner</text>

  <path d="M915 287 V315" class="flow"/>
  <rect x="755" y="315" width="320" height="72" rx="10" fill="#FFF3DB" stroke="#F7941D" stroke-width="3"/>
  <text x="915" y="360" text-anchor="middle" class="sans heading">2. Block layout</text>

  <path d="M915 387 V415" class="flow"/>
  <rect x="755" y="415" width="320" height="72" rx="10" fill="#EAF7F3" stroke="#189D85" stroke-width="3"/>
  <text x="915" y="460" text-anchor="middle" class="sans heading">3. Vertex layout</text>

  <path d="M1110 325 H1165" class="flow"/>

  <rect x="1165" y="155" width="190" height="340" rx="14" fill="#EEF6FC" stroke="#1683BD" stroke-width="4"/>
  <text x="1260" y="205" text-anchor="middle" class="sans heading">Output</text>
  <text x="1260" y="265" text-anchor="middle" class="sans body">Validated</text>
  <text x="1260" y="300" text-anchor="middle" class="sans body">mapping</text>
  <line x1="1200" y1="335" x2="1320" y2="335" stroke="#AEB7BF" stroke-width="2"/>
  <text x="1260" y="385" text-anchor="middle" class="sans body">Relabeled</text>
  <text x="1260" y="420" text-anchor="middle" class="sans body">CSR + kernels</text>

  <rect x="125" y="545" width="1150" height="70" rx="12" fill="#FFFFFF" stroke="#17212B" stroke-width="3"/>
  <text x="700" y="575" text-anchor="middle" class="sans label">Scientific contract</text>
  <text x="700" y="603" text-anchor="middle" class="sans body">exact configuration + mapping cost + kernel time + reuse + held-out evidence</text>
</svg>
