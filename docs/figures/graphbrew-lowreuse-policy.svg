<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">GraphBrew low-reuse decision</title>
  <desc id="desc">A new graph is sampled without running a graph kernel. A frozen rule chooses the non-Rabbit GraphBrew arm or Boost Rabbit fallback. Selected graphs must beat Rabbit; fallback graphs tie the baseline.</desc>
  <defs>
    <marker id="blue-arrow" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M0 0 L12 5 L0 10 Z" fill="#1683BD"/>
    </marker>
    <marker id="orange-arrow" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M0 0 L12 5 L0 10 Z" fill="#F7941D"/>
    </marker>
    <style>
      .sans{font-family:Arial,Helvetica,sans-serif}
      .title{font-size:40px;font-weight:700;fill:#17212B}
      .subtitle{font-size:22px;fill:#4B5560}
      .heading{font-size:27px;font-weight:700;fill:#17212B}
      .body{font-size:21px;fill:#27313A}
      .label{font-size:20px;font-weight:700;fill:#27313A}
      .blueflow{fill:none;stroke:#1683BD;stroke-width:5;marker-end:url(#blue-arrow)}
      .orangeflow{fill:none;stroke:#F7941D;stroke-width:5;marker-end:url(#orange-arrow)}
    </style>
  </defs>

  <rect width="1400" height="700" fill="#FFFFFF"/>
  <text x="45" y="55" class="sans title">New graph, no prior run: one frozen decision</text>
  <text x="45" y="88" class="sans subtitle">The selector never benchmarks Rabbit or GraphBrew before choosing.</text>
  <line x1="45" y1="112" x2="1355" y2="112" stroke="#17212B" stroke-width="2"/>

  <rect x="45" y="160" width="235" height="330" rx="14" fill="#EEF6FC" stroke="#1683BD" stroke-width="4"/>
  <text x="162" y="205" text-anchor="middle" class="sans heading">New workload</text>
  <text x="75" y="265" class="sans body">Graph</text>
  <text x="75" y="310" class="sans body">Kernel</text>
  <text x="75" y="355" class="sans body">Machine LLC</text>
  <text x="75" y="400" class="sans body">Reuse = 1 or 2</text>
  <text x="162" y="458" text-anchor="middle" class="sans label">no graph name</text>

  <path d="M280 325 H335" class="blueflow"/>

  <rect x="335" y="160" width="285" height="330" rx="14" fill="#EAF7F3" stroke="#189D85" stroke-width="4"/>
  <text x="477" y="205" text-anchor="middle" class="sans heading">Tier-0 sample</text>
  <text x="365" y="265" class="sans body">1,024-8,192 vertices</text>
  <text x="365" y="310" class="sans body">Average degree</text>
  <text x="365" y="355" class="sans body">Degree CV</text>
  <text x="365" y="400" class="sans body">Property / LLC</text>
  <text x="477" y="458" text-anchor="middle" class="sans label">no kernel execution</text>

  <path d="M620 325 H675" class="blueflow"/>

  <rect x="675" y="160" width="285" height="330" rx="14" fill="#F8FAFB" stroke="#17212B" stroke-width="4"/>
  <text x="817" y="205" text-anchor="middle" class="sans heading">Frozen rule</text>
  <text x="705" y="260" class="sans body">Supported kernel?</text>
  <text x="705" y="305" class="sans body">Nodes &gt;= 1,000?</text>
  <text x="705" y="350" class="sans body">WSR / LLC &lt;= 3.2?</text>
  <text x="705" y="395" class="sans body">Skew branch matches?</text>
  <text x="817" y="458" text-anchor="middle" class="sans label">same rule for every graph</text>

  <path d="M960 245 H1015" class="orangeflow"/>
  <rect x="1015" y="160" width="340" height="180" rx="14" fill="#FFF3DB" stroke="#F7941D" stroke-width="4"/>
  <text x="1185" y="205" text-anchor="middle" class="sans heading">GraphBrew arm</text>
  <text x="1185" y="250" text-anchor="middle" class="sans body">Leiden + SizeDesc</text>
  <text x="1185" y="285" text-anchor="middle" class="sans body">Gorder8 / BFS</text>
  <text x="1185" y="320" text-anchor="middle" class="sans label">non-Rabbit mapping</text>

  <path d="M960 410 H1015" class="blueflow"/>
  <rect x="1015" y="370" width="340" height="120" rx="14" fill="#EEF6FC" stroke="#1683BD" stroke-width="4"/>
  <text x="1185" y="415" text-anchor="middle" class="sans heading">Boost Rabbit</text>
  <text x="1185" y="458" text-anchor="middle" class="sans body">validated fallback</text>

  <rect x="45" y="540" width="640" height="110" rx="14" fill="#FFF3DB" stroke="#F7941D" stroke-width="3"/>
  <text x="365" y="580" text-anchor="middle" class="sans heading">GraphBrew selected</text>
  <text x="365" y="620" text-anchor="middle" class="sans body">must beat Boost Rabbit on final selected holdouts</text>

  <rect x="715" y="540" width="640" height="110" rx="14" fill="#EEF6FC" stroke="#1683BD" stroke-width="3"/>
  <text x="1035" y="580" text-anchor="middle" class="sans heading">Rabbit fallback</text>
  <text x="1035" y="620" text-anchor="middle" class="sans body">ties the always-Boost baseline; no GraphBrew win claimed</text>
</svg>
