<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc" fill="#27313A">
  <title id="title">Validated low-reuse selector: one rule, two real holdout outcomes</title>
  <desc id="desc">This is the current evidence-bound policy, separate from the proposed Rabbit-free generator.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 Z" fill="#1769C2"/>
    </marker>
    <style>
      :root{color-scheme:light dark}
      @media(prefers-color-scheme:dark){
        [fill="#27313A"]{fill:#ECE7DD}[stroke="#27313A"]{stroke:#ECE7DD}
        [fill="#FFFFFF"]{fill:#1E2327}[fill="#F8F6EC"]{fill:#252A2E}
        [fill="#EDF5FF"]{fill:#273846}[fill="#E7F7EA"]{fill:#24382A}
        [fill="#FFF0D8"]{fill:#3B3122}[fill="#F7DEDC"]{fill:#3D292A}
        [fill="#EEE9FF"]{fill:#302C3C}[stroke="#9AA3AD"]{stroke:#747D86}
        [stroke="#1769C2"]{stroke:#63A8FF}[fill="#1769C2"]{fill:#63A8FF}
        [stroke="#B45309"]{stroke:#F0B35A}[stroke="#15803D"]{stroke:#63D68B}
        .arrow{stroke:#63A8FF!important}.edge{stroke:#ECE7DD!important}
      }
      .sans{font-family:Arial,Helvetica,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,monospace}
      .title{font-size:32px;font-weight:700}.subtitle{font-size:18px}
      .domain{font-size:16px;font-weight:700;letter-spacing:1.2px}.heading{font-size:22px;font-weight:700}
      .label{font-size:18px;font-weight:700}.body{font-size:17px}.small{font-size:16px}.micro{font-size:14px;font-weight:700}
      .arrow{fill:none;stroke:#1769C2;stroke-width:3;marker-end:url(#arrow)}
      .edge{stroke:#27313A;stroke-width:2.2}
    </style>
  </defs>
  <rect width="1200" height="680" fill="#FFFFFF"/>
  <text x="42" y="47" class="sans title">Validated low-reuse selector: one rule, two real holdout outcomes</text>
  <text x="42" y="75" class="sans subtitle">Reuse = 2 examples from the frozen rule2 holdout: amazon0601 and soc-Slashdot0811.</text>
  <line x1="42" y1="99" x2="1158" y2="99" stroke="#27313A" stroke-width="2"/>
  <rect x="35" y="120" width="300" height="210" rx="10" fill="#EDF5FF" stroke="#27313A" stroke-width="3"/>
  <text x="60" y="155" class="sans heading">Runtime inputs</text>
  <text x="60" y="195" class="sans body">Graph + supported kernel</text>
  <text x="60" y="225" class="sans body">Machine LLC</text>
  <text x="60" y="255" class="sans body">Declared reuse = 2</text>
  <text x="60" y="285" class="sans body">Tier-0 sampled features</text>
  <rect x="450" y="120" width="300" height="210" rx="10" fill="#EEE9FF" stroke="#27313A" stroke-width="3"/>
  <text x="475" y="155" class="sans heading">Frozen predicate</text>
  <text x="475" y="194" class="mono small">kernel supported; reuse &lt;= 2</text>
  <text x="475" y="220" class="mono small">N &gt;= 1,000; WSR/LLC &lt;= 3.2</text>
  <text x="475" y="246" class="mono small">CV &lt;= 2.68 and (deg &lt;= 60</text>
  <text x="475" y="270" class="mono small">or WSR/LLC &lt;= 0.82), or CV &gt; 8</text>
  <text x="475" y="302" class="sans small">No benchmarking before choice.</text>
  <rect x="865" y="120" width="300" height="210" rx="10" fill="#FFF0D8" stroke="#27313A" stroke-width="3"/>
  <text x="890" y="155" class="sans heading">Selected arm</text>
  <text x="890" y="198" class="sans body">FastLeiden-Gorder8</text>
  <text x="890" y="228" class="sans body">or Rabbit Boost fallback</text>
  <text x="890" y="270" class="sans small">This is a validated portfolio,</text>
  <text x="890" y="296" class="sans small">not the final Rabbit-free claim.</text>
  <path d="M335 225 H446" class="arrow"/>
  <path d="M750 225 H861" class="arrow"/>
  <rect x="35" y="375" width="545" height="220" rx="10" fill="#E7F7EA" stroke="#27313A" stroke-width="3"/>
  <text x="60" y="410" class="sans heading">SELECTED: amazon0601</text>
  <text x="60" y="448" class="mono body">degree CV = 0.726</text>
  <text x="60" y="478" class="mono body">WSR/LLC = 0.140</text>
  <text x="60" y="508" class="mono body">candidate/Boost map = 0.550</text>
  <text x="60" y="538" class="mono body">Boost/candidate kernel = 1.279</text>
  <text x="60" y="568" class="mono label">Boost/selected E2E = 1.745x</text>
  <rect x="620" y="375" width="545" height="220" rx="10" fill="#F7DEDC" stroke="#27313A" stroke-width="3"/>
  <text x="645" y="410" class="sans heading">FALLBACK: soc-Slashdot0811</text>
  <text x="645" y="448" class="mono body">degree CV = 3.023</text>
  <text x="645" y="478" class="mono body">WSR/LLC = 0.027</text>
  <text x="645" y="508" class="mono body">Boost/candidate kernel = 0.862</text>
  <text x="645" y="542" class="sans body">Outside the frozen GraphBrew region.</text>
  <text x="645" y="572" class="mono label">Boost/selected E2E = 1.000x</text>
  <rect x="144" y="620" width="912" height="44" rx="9" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="600" y="647" class="sans small" text-anchor="middle">Evidence scope: seven kernels, reuse 1-2, fixed platform; the selector is not a universal GraphBrew result.</text>
</svg>
