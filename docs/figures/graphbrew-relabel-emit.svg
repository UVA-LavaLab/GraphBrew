<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="545" viewBox="0 0 1200 545" role="img" aria-labelledby="title desc" fill="#27313A">
  <title id="title">Stage 5: compose the block and local orders into relabeled CSR</title>
  <desc id="desc">The final permutation maps tracked v2 to new ID 0 and rewrites CSR rows and destinations consistently.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 Z" fill="#1769C2"/>
    </marker>
    <style>
      :root{color-scheme:light dark}
      @media(prefers-color-scheme:dark){
        [fill="#27313A"]{fill:#ECE7DD}[stroke="#27313A"]{stroke:#ECE7DD}
        [fill="#FFFFFF"]{fill:#1E2327}[fill="#F8F6EC"]{fill:#252A2E}
        [fill="#EDF5FF"]{fill:#273846}[fill="#E7F7EA"]{fill:#24382A}
        [fill="#FFF0D8"]{fill:#3B3122}[fill="#F7DEDC"]{fill:#3D292A}
        [fill="#EEE9FF"]{fill:#302C3C}[stroke="#9AA3AD"]{stroke:#747D86}
        [stroke="#1769C2"]{stroke:#63A8FF}[fill="#1769C2"]{fill:#63A8FF}
        .arrow{stroke:#63A8FF!important}.edge{stroke:#ECE7DD!important}
      }
      .sans{font-family:Arial,Helvetica,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,monospace}
      .title{font-size:32px;font-weight:700}.subtitle{font-size:18px}
      .domain{font-size:16px;font-weight:700;letter-spacing:1.2px}.heading{font-size:22px;font-weight:700}
      .label{font-size:18px;font-weight:700}.body{font-size:17px}.small{font-size:16px}
      .arrow{fill:none;stroke:#1769C2;stroke-width:3;marker-end:url(#arrow)}
      .edge{stroke:#27313A;stroke-width:2.2}
    </style>
  </defs>
  <rect width="1200" height="545" fill="#FFFFFF"/>
  <text x="42" y="47" class="sans title">Stage 5: compose the block and local orders into relabeled CSR</text>
  <text x="42" y="75" class="sans subtitle">Final memory order: [v2,v1,v4,v6,v7 | v8,v5,v0,v3].</text>
  <line x1="42" y1="99" x2="1158" y2="99" stroke="#27313A" stroke-width="2"/>
  <rect x="35" y="120" width="550" height="345" rx="10" fill="#EEE9FF" stroke="#27313A" stroke-width="3"/>
  <circle cx="65" cy="150" r="17" fill="#27313A" stroke="#27313A" stroke-width="1"/>
  <text x="65" y="156" class="sans label" text-anchor="middle" fill="#FFFFFF">5</text>
  <text x="95" y="157" class="sans heading">Old ID -&gt; new ID</text>
  <rect x="60.00" y="200" width="55.56" height="42" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="87" y="226" class="mono small" text-anchor="middle">v0</text>
  <rect x="115.56" y="200" width="55.56" height="42" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="143" y="226" class="mono small" text-anchor="middle">v1</text>
  <rect x="171.11" y="200" width="55.56" height="42" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="198" y="226" class="mono small" text-anchor="middle">v2</text>
  <rect x="226.67" y="200" width="55.56" height="42" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="254" y="226" class="mono small" text-anchor="middle">v3</text>
  <rect x="282.22" y="200" width="55.56" height="42" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="310" y="226" class="mono small" text-anchor="middle">v4</text>
  <rect x="337.78" y="200" width="55.56" height="42" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="365" y="226" class="mono small" text-anchor="middle">v5</text>
  <rect x="393.33" y="200" width="55.56" height="42" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="421" y="226" class="mono small" text-anchor="middle">v6</text>
  <rect x="448.89" y="200" width="55.56" height="42" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
