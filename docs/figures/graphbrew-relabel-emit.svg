  <text x="87" y="278" class="mono small" text-anchor="middle">n7</text>
  <rect x="115.56" y="252" width="55.56" height="42" fill="#E7F7EA" stroke="#27313A" stroke-width="1.5"/>
  <text x="143" y="278" class="mono small" text-anchor="middle">n1</text>
  <rect x="171.11" y="252" width="55.56" height="42" fill="#E7F7EA" stroke="#1769C2" stroke-width="3"/>
  <text x="198" y="278" class="mono small" text-anchor="middle">n0</text>
  <rect x="226.67" y="252" width="55.56" height="42" fill="#E7F7EA" stroke="#27313A" stroke-width="1.5"/>
  <text x="254" y="278" class="mono small" text-anchor="middle">n8</text>
  <rect x="282.22" y="252" width="55.56" height="42" fill="#E7F7EA" stroke="#27313A" stroke-width="1.5"/>
  <text x="310" y="278" class="mono small" text-anchor="middle">n2</text>
  <rect x="337.78" y="252" width="55.56" height="42" fill="#E7F7EA" stroke="#27313A" stroke-width="1.5"/>
  <text x="365" y="278" class="mono small" text-anchor="middle">n6</text>
  <rect x="393.33" y="252" width="55.56" height="42" fill="#E7F7EA" stroke="#27313A" stroke-width="1.5"/>
  <text x="421" y="278" class="mono small" text-anchor="middle">n3</text>
  <rect x="448.89" y="252" width="55.56" height="42" fill="#E7F7EA" stroke="#27313A" stroke-width="1.5"/>
  <text x="476" y="278" class="mono small" text-anchor="middle">n4</text>
  <rect x="504.44" y="252" width="55.56" height="42" fill="#E7F7EA" stroke="#27313A" stroke-width="1.5"/>
  <text x="532" y="278" class="mono small" text-anchor="middle">n5</text>
  <text x="60" y="330" class="sans label">Composed memory order</text>
  <rect x="60.00" y="350" width="55.56" height="42" fill="#EDF5FF" stroke="#1769C2" stroke-width="3"/>
  <text x="87" y="376" class="mono small" text-anchor="middle">v2</text>
  <rect x="115.56" y="350" width="55.56" height="42" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="143" y="376" class="mono small" text-anchor="middle">v1</text>
  <rect x="171.11" y="350" width="55.56" height="42" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="198" y="376" class="mono small" text-anchor="middle">v4</text>
  <rect x="226.67" y="350" width="55.56" height="42" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="254" y="376" class="mono small" text-anchor="middle">v6</text>
  <rect x="282.22" y="350" width="55.56" height="42" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="310" y="376" class="mono small" text-anchor="middle">v7</text>
  <rect x="337.78" y="350" width="55.56" height="42" fill="#FFF0D8" stroke="#27313A" stroke-width="1.5"/>
  <text x="365" y="376" class="mono small" text-anchor="middle">v8</text>
  <rect x="393.33" y="350" width="55.56" height="42" fill="#FFF0D8" stroke="#27313A" stroke-width="1.5"/>
  <text x="421" y="376" class="mono small" text-anchor="middle">v5</text>
  <rect x="448.89" y="350" width="55.56" height="42" fill="#FFF0D8" stroke="#27313A" stroke-width="1.5"/>
  <text x="476" y="376" class="mono small" text-anchor="middle">v0</text>
  <rect x="504.44" y="350" width="55.56" height="42" fill="#FFF0D8" stroke="#27313A" stroke-width="1.5"/>
  <text x="532" y="376" class="mono small" text-anchor="middle">v3</text>
  <rect x="615" y="120" width="550" height="345" rx="10" fill="#E7F7EA" stroke="#27313A" stroke-width="3"/>
  <text x="640" y="157" class="sans heading">Relabeled CSR row 0 (old v2)</text>
  <text x="640" y="200" class="mono body">offsets[0:2] = [0, 4]</text>
  <text x="640" y="236" class="sans body">new neighbor IDs</text>
  <rect x="640.00" y="255" width="125.00" height="42" fill="#E7F7EA" stroke="#27313A" stroke-width="1.5"/>
  <text x="702" y="281" class="mono small" text-anchor="middle">1</text>
  <rect x="765.00" y="255" width="125.00" height="42" fill="#E7F7EA" stroke="#27313A" stroke-width="1.5"/>
  <text x="827" y="281" class="mono small" text-anchor="middle">2</text>
  <rect x="890.00" y="255" width="125.00" height="42" fill="#E7F7EA" stroke="#27313A" stroke-width="1.5"/>
  <text x="952" y="281" class="mono small" text-anchor="middle">3</text>
  <rect x="1015.00" y="255" width="125.00" height="42" fill="#E7F7EA" stroke="#27313A" stroke-width="1.5"/>
  <text x="1077" y="281" class="mono small" text-anchor="middle">5</text>
  <text x="640" y="340" class="mono label">row 0 = [1, 2, 3, 5]</text>
  <text x="640" y="382" class="sans body">All 24 directed arcs are preserved.</text>
  <text x="640" y="412" class="sans body">Only row and destination indices change.</text>
  <path d="M585 290 H611" class="arrow"/>
  <rect x="144" y="490" width="912" height="44" rx="9" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="600" y="517" class="sans small" text-anchor="middle">Invariant: the permutation is bijective and the relabeled CSR represents the same graph.</text>
</svg>
