<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc" fill="#27313A" data-figure-schema="graphbrew-public/v4">
  <title id="title">GraphBrew evidence boundary</title>
  <desc id="desc">Confirmed quality and construction claims are separated from post-selected or graph-held-out failures.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 Z" fill="#1769C2"/>
    </marker>
    <style>
      :root{color-scheme:light dark}
      @media(prefers-color-scheme:dark){
        [fill="#27313A"]{fill:#ECE7DD}[stroke="#27313A"]{stroke:#ECE7DD}
        [fill="#FFFFFF"]{fill:#1E2327}[fill="#F8F6EC"]{fill:#252A2E}
        [fill="#EDF5FF"]{fill:#273846}[fill="#E7F7EA"]{fill:#24382A}
        [fill="#FFF0D8"]{fill:#3B3122}[fill="#F7DEDC"]{fill:#3D292A}
        [fill="#EEE9FF"]{fill:#302C3C}[stroke="#9AA3AD"]{stroke:#747D86}
        [stroke="#1769C2"]{stroke:#63A8FF}[fill="#1769C2"]{fill:#63A8FF}
        [stroke="#B45309"]{stroke:#F0B35A}[stroke="#15803D"]{stroke:#63D68B}
        .arrow{stroke:#63A8FF!important}.edge{stroke:#ECE7DD!important}
      }
      .sans{font-family:Arial,Helvetica,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,monospace}
      .title{font-size:32px;font-weight:700}.subtitle{font-size:18px}
      .domain{font-size:16px;font-weight:700;letter-spacing:1.2px}.heading{font-size:22px;font-weight:700}
      .label{font-size:18px;font-weight:700}.body{font-size:17px}.small{font-size:16px}.micro{font-size:14px;font-weight:700}
      .arrow{fill:none;stroke:#1769C2;stroke-width:3;marker-end:url(#arrow)}
      .edge{stroke:#27313A;stroke-width:2.2}
    </style>
  </defs>
  <rect width="1200" height="620" fill="#FFFFFF"/>
  <text x="42" y="47" class="sans title">GraphBrew evidence boundary</text>
  <text x="42" y="75" class="sans subtitle">Values are frozen geometric means; arrows above one favor GraphBrew unless labeled as mapping cost.</text>
  <line x1="42" y1="99" x2="1158" y2="99" stroke="#27313A" stroke-width="2"/>
  <rect x="25" y="120" width="350" height="390" rx="10" fill="#E7F7EA" stroke="#27313A" stroke-width="3"/>
  <text x="50" y="158" class="sans domain">CONFIRMED: FIXED QUALITY</text>
  <text x="50" y="198" class="sans heading">LeidenGVE-SizeDesc-LocalGorder8</text>
  <text x="50" y="238" class="mono small">Rabbit CSR / GraphBrew = 1.042x</text>
  <text x="50" y="270" class="mono small">Rabbit Boost / GraphBrew = 1.044x</text>
  <text x="50" y="302" class="mono small">GORDER_csr / GraphBrew = 1.052x</text>
  <text x="50" y="350" class="mono small">GraphBrew / GORDER_csr map = 0.752x</text>
  <text x="50" y="400" class="sans body">Quality point, not per-cell dominance.</text>
  <text x="50" y="434" class="sans body">Rabbit break-even: 37k-40k reuses.</text>
  <text x="50" y="468" class="sans body">Summed Rabbit seconds never cross.</text>
  <rect x="425" y="120" width="350" height="390" rx="10" fill="#FFF0D8" stroke="#27313A" stroke-width="3"/>
  <text x="450" y="158" class="sans domain">CONFIRMED: CONSTRUCTION</text>
  <text x="450" y="198" class="sans heading">Compact-and-Emit</text>
  <text x="450" y="238" class="sans body">Compact active community IDs.</text>
  <text x="450" y="270" class="sans body">Emit final IDs during BFS.</text>
  <text x="450" y="318" class="mono small">candidate / min-Rabbit map = 0.479x</text>
  <text x="450" y="350" class="mono small">Wiki-Talk complete map = 0.310s</text>
  <text x="450" y="400" class="sans body">Final BFS permutation is preserved.</text>
  <text x="450" y="434" class="sans body">ORIGINAL audit closes low-reuse claim.</text>
  <text x="450" y="468" class="sans body">This is a systems optimization.</text>
  <rect x="825" y="120" width="350" height="390" rx="10" fill="#F7DEDC" stroke="#27313A" stroke-width="3"/>
  <text x="850" y="158" class="sans domain">REJECTED: ADAPTIVE HEADLINE</text>
  <text x="850" y="198" class="sans heading">Corrected composition atlas</text>
  <text x="850" y="242" class="mono small">in-sample oracle = 1.062x</text>
  <text x="850" y="274" class="mono small">best fixed arm = 0.946x</text>
  <text x="850" y="306" class="mono small">graph-held-out = 0.907x</text>
  <text x="850" y="360" class="sans body">Oracle headroom is post-selected.</text>
  <text x="850" y="394" class="sans body">Held-out selection loses overall.</text>
  <text x="850" y="428" class="sans body">No generator or selector claim.</text>
  <text x="850" y="462" class="sans body">Failed portal hooks were removed.</text>
  <rect x="144" y="545" width="912" height="44" rx="9" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="600" y="572" class="sans small" text-anchor="middle">Public claim: explicit composition framework + fixed quality arm + Compact-and-Emit. Nothing else is promoted.</text>
</svg>
