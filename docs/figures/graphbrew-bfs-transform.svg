  <rect x="866.00" y="470" width="88.00" height="42" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="910" y="496" class="mono small" text-anchor="middle">v4</text>
  <rect x="954.00" y="470" width="88.00" height="42" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="998" y="496" class="mono small" text-anchor="middle">v6</text>
