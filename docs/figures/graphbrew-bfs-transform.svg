  <rect x="690.00" y="470" width="88.00" height="42" fill="#EDF5FF" stroke="#1769C2" stroke-width="3"/>
  <text x="734" y="496" class="mono small" text-anchor="middle">v2</text>
  <rect x="778.00" y="470" width="88.00" height="42" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
