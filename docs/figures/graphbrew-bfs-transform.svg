  <text x="1086" y="496" class="mono small" text-anchor="middle">v7</text>
  <path d="M535 335 H661" class="arrow"/>
  <rect x="144" y="565" width="912" height="44" rx="9" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="600" y="592" class="sans small" text-anchor="middle">Invariant: C0 remains the first five global IDs; BFS only assigns its local order.</text>
