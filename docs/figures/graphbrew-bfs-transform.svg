<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="535" viewBox="0 0 1200 535" role="img" aria-labelledby="title desc" fill="#27313A">
  <title id="title">Stage 4B: hub-rooted BFS orders the large C0 block</title>
  <desc id="desc">The tracked vertex v2 is the highest-degree root and receives local ID 0.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 Z" fill="#1769C2"/>
    </marker>
    <style>
      :root{color-scheme:light dark}
      @media(prefers-color-scheme:dark){
        [fill="#27313A"]{fill:#ECE7DD}[stroke="#27313A"]{stroke:#ECE7DD}
        [fill="#FFFFFF"]{fill:#1E2327}[fill="#F8F6EC"]{fill:#252A2E}
        [fill="#EDF5FF"]{fill:#273846}[fill="#E7F7EA"]{fill:#24382A}
        [fill="#FFF0D8"]{fill:#3B3122}[fill="#F7DEDC"]{fill:#3D292A}
        [fill="#EEE9FF"]{fill:#302C3C}[stroke="#9AA3AD"]{stroke:#747D86}
        [stroke="#1769C2"]{stroke:#63A8FF}[fill="#1769C2"]{fill:#63A8FF}
        .arrow{stroke:#63A8FF!important}.edge{stroke:#ECE7DD!important}
      }
      .sans{font-family:Arial,Helvetica,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,monospace}
      .title{font-size:32px;font-weight:700}.subtitle{font-size:18px}
      .domain{font-size:16px;font-weight:700;letter-spacing:1.2px}.heading{font-size:22px;font-weight:700}
      .label{font-size:18px;font-weight:700}.body{font-size:17px}.small{font-size:16px}
      .arrow{fill:none;stroke:#1769C2;stroke-width:3;marker-end:url(#arrow)}
      .edge{stroke:#27313A;stroke-width:2.2}
    </style>
  </defs>
  <rect width="1200" height="535" fill="#FFFFFF"/>
  <text x="42" y="47" class="sans title">Stage 4B: hub-rooted BFS orders the large C0 block</text>
  <text x="42" y="75" class="sans subtitle">Same C0 = {1,2,4,6,7}; BFS levels are [2] -&gt; [1,4,6] -&gt; [7].</text>
  <line x1="42" y1="99" x2="1158" y2="99" stroke="#27313A" stroke-width="2"/>
  <rect x="35" y="120" width="500" height="330" rx="10" fill="#EDF5FF" stroke="#27313A" stroke-width="3"/>
  <text x="60" y="155" class="sans heading">Before local layout</text>
  <line x1="285" y1="155" x2="384" y2="228" class="edge"/>
  <line x1="285" y1="155" x2="186" y2="228" class="edge"/>
  <line x1="384" y1="228" x2="346" y2="344" class="edge"/>
  <line x1="384" y1="228" x2="224" y2="344" class="edge"/>
  <line x1="346" y1="344" x2="224" y2="344" class="edge"/>
  <line x1="224" y1="344" x2="186" y2="228" class="edge"/>
  <circle cx="285" cy="155" r="20" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/>
  <text x="285" y="160" class="sans label" text-anchor="middle">1</text>
  <circle cx="384" cy="228" r="23" fill="#E7F7EA" stroke="#1769C2" stroke-width="3"/>
  <text x="384" y="233" class="sans label" text-anchor="middle">2</text>
  <circle cx="346" cy="344" r="20" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/>
  <text x="346" y="349" class="sans label" text-anchor="middle">4</text>
  <circle cx="224" cy="344" r="20" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/>
  <text x="224" y="349" class="sans label" text-anchor="middle">6</text>
  <circle cx="186" cy="228" r="20" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/>
  <text x="186" y="233" class="sans label" text-anchor="middle">7</text>
  <rect x="60.00" y="390" width="90.00" height="42" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="105" y="416" class="mono small" text-anchor="middle">v1</text>
  <rect x="150.00" y="390" width="90.00" height="42" fill="#EDF5FF" stroke="#1769C2" stroke-width="3"/>
  <text x="195" y="416" class="mono small" text-anchor="middle">v2</text>
  <rect x="240.00" y="390" width="90.00" height="42" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="285" y="416" class="mono small" text-anchor="middle">v4</text>
  <rect x="330.00" y="390" width="90.00" height="42" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="375" y="416" class="mono small" text-anchor="middle">v6</text>
  <rect x="420.00" y="390" width="90.00" height="42" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="465" y="416" class="mono small" text-anchor="middle">v7</text>
  <rect x="665" y="120" width="500" height="330" rx="10" fill="#E7F7EA" stroke="#27313A" stroke-width="3"/>
  <circle cx="695" cy="150" r="17" fill="#27313A" stroke="#27313A" stroke-width="1"/>
  <text x="695" y="156" class="sans label" text-anchor="middle" fill="#FFFFFF">4B</text>
  <text x="735" y="157" class="sans heading">After BFS levels</text>
  <line x1="915" y1="155" x2="1014" y2="228" class="edge"/>
  <line x1="915" y1="155" x2="816" y2="228" class="edge"/>
  <line x1="1014" y1="228" x2="976" y2="344" class="edge"/>
  <line x1="1014" y1="228" x2="854" y2="344" class="edge"/>
  <line x1="976" y1="344" x2="854" y2="344" class="edge"/>
  <line x1="854" y1="344" x2="816" y2="228" class="edge"/>
  <circle cx="915" cy="155" r="20" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/>
  <text x="915" y="160" class="sans label" text-anchor="middle">1</text>
  <circle cx="1014" cy="228" r="23" fill="#E7F7EA" stroke="#1769C2" stroke-width="3"/>
  <text x="1014" y="233" class="sans label" text-anchor="middle">0</text>
  <circle cx="976" cy="344" r="20" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/>
  <text x="976" y="349" class="sans label" text-anchor="middle">2</text>
  <circle cx="854" cy="344" r="20" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/>
  <text x="854" y="349" class="sans label" text-anchor="middle">3</text>
  <circle cx="816" cy="228" r="20" fill="#EDF5FF" stroke="#27313A" stroke-width="2"/>
  <text x="816" y="233" class="sans label" text-anchor="middle">4</text>
  <rect x="690.00" y="390" width="90.00" height="42" fill="#EDF5FF" stroke="#1769C2" stroke-width="3"/>
  <text x="735" y="416" class="mono small" text-anchor="middle">v2</text>
  <rect x="780.00" y="390" width="90.00" height="42" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="825" y="416" class="mono small" text-anchor="middle">v1</text>
  <rect x="870.00" y="390" width="90.00" height="42" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="915" y="416" class="mono small" text-anchor="middle">v4</text>
  <rect x="960.00" y="390" width="90.00" height="42" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="1005" y="416" class="mono small" text-anchor="middle">v6</text>
  <rect x="1050.00" y="390" width="90.00" height="42" fill="#EDF5FF" stroke="#27313A" stroke-width="1.5"/>
  <text x="1095" y="416" class="mono small" text-anchor="middle">v7</text>
  <path d="M535 290 H661" class="arrow"/>
  <rect x="144" y="475" width="912" height="44" rx="9" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="600" y="502" class="sans small" text-anchor="middle">Invariant: C0 remains the first five global IDs; BFS only assigns its local order.</text>
</svg>
