<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc" fill="#27313A">
  <title id="title">BFS intra-community transformation</title>
  <desc id="desc">A large community keeps the same topology and block boundary. A high-degree root receives local ID zero and breadth-first levels receive consecutive IDs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="9" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 Z" fill="#1769C2"/>
    </marker>
    <style>
      :root{color-scheme:light dark}
      @media(prefers-color-scheme:dark){
        [fill="#27313A"]{fill:#ECE7DD}[stroke="#27313A"]{stroke:#ECE7DD}
        [fill="#FFFFFF"]{fill:#1E2327}
        [fill="#F8F6EC"]{fill:#252A2E}[fill="#EDF5FF"]{fill:#273846}
        [fill="#E7F7EA"]{fill:#24382A}[fill="#FFF0D8"]{fill:#3B3122}
        [fill="#F7DEDC"]{fill:#3D292A}[fill="#EEE9FF"]{fill:#302C3C}
        [stroke="#9AA3AD"]{stroke:#747D86}
      }
      .sans{font-family:Arial,Helvetica,sans-serif}
      .title{font-size:44px;font-weight:700}.subtitle{font-size:24px}
      .domain{font-size:21px;font-weight:700;letter-spacing:1.3px}
      .heading{font-size:31px;font-weight:700}.body{font-size:24px}
      .label{font-size:22px;font-weight:700}
      .edge{stroke:#747D86;stroke-width:3.5}
      .node{stroke:#27313A;stroke-width:2.5}
      .flow{fill:none;stroke:#1769C2;stroke-width:3;marker-end:url(#arrow)}
          .graph-panel{stroke:#9AA3AD;stroke-width:2}
    </style>
  </defs>
  <rect width="1400" height="650" fill="#FFFFFF"/>

  <text x="45" y="55" class="sans title">4. BFS fallback: order a large community by traversal level</text>
  <text x="45" y="88" class="sans subtitle">The highest-degree root starts the order; breadth-first levels follow.</text>
  <line x1="45" y1="112" x2="1355" y2="112" stroke="#27313A" stroke-width="2"/>

  <rect x="35" y="135" width="1330" height="490" rx="12" fill="none" stroke="#9AA3AD" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="52" y="162" class="sans domain">INTRA-COMMUNITY TRANSFORMATION</text>
  <text x="350" y="195" text-anchor="middle" class="sans heading">Before local ordering</text>
  <text x="1050" y="195" text-anchor="middle" class="sans heading">After hub-rooted BFS</text>
  <rect x="145" y="205" width="410" height="340" rx="12" fill="#F8F6EC" class="graph-panel"/>
  <rect x="845" y="205" width="410" height="340" rx="12" fill="#EDF5FF" class="graph-panel"/>

  <g transform="translate(0 45)">
  <circle cx="350" cy="330" r="155" fill="#EDF5FF" stroke="#9AA3AD" stroke-width="2" stroke-dasharray="7 6"/>
  <circle cx="1050" cy="330" r="155" fill="#EDF5FF" stroke="#9AA3AD" stroke-width="2" stroke-dasharray="7 6"/>
  <circle cx="1050" cy="330" r="72" fill="none" stroke="#9AA3AD" stroke-width="2" stroke-dasharray="5 6"/>
  <circle cx="1050" cy="330" r="125" fill="none" stroke="#9AA3AD" stroke-width="2" stroke-dasharray="5 6"/>

  <g class="edge">
    <line x1="350" y1="330" x2="280" y2="255"/><line x1="350" y1="330" x2="430" y2="255"/>
    <line x1="350" y1="330" x2="260" y2="365"/><line x1="280" y1="255" x2="210" y2="215"/>
    <line x1="280" y1="255" x2="235" y2="440"/><line x1="430" y1="255" x2="500" y2="215"/>
    <line x1="430" y1="255" x2="490" y2="420"/><line x1="260" y1="365" x2="350" y2="455"/>

    <line x1="1050" y1="330" x2="980" y2="255"/><line x1="1050" y1="330" x2="1130" y2="255"/>
    <line x1="1050" y1="330" x2="960" y2="365"/><line x1="980" y1="255" x2="910" y2="215"/>
    <line x1="980" y1="255" x2="935" y2="440"/><line x1="1130" y1="255" x2="1200" y2="215"/>
    <line x1="1130" y1="255" x2="1190" y2="420"/><line x1="960" y1="365" x2="1050" y2="455"/>
  </g>

  <g class="sans body" text-anchor="middle">
    <circle cx="350" cy="330" r="31" fill="#E7F7EA" class="node"/><text x="350" y="337">5</text>
    <circle cx="280" cy="255" r="28" fill="#F8F6EC" class="node"/><text x="280" y="262">1</text>
    <circle cx="430" cy="255" r="28" fill="#F8F6EC" class="node"/><text x="430" y="262">7</text>
    <circle cx="260" cy="365" r="28" fill="#F8F6EC" class="node"/><text x="260" y="372">3</text>
    <circle cx="210" cy="215" r="31" fill="#F8F6EC" class="node"/><text x="210" y="222">6</text>
    <circle cx="235" cy="440" r="31" fill="#F8F6EC" class="node"/><text x="235" y="447">0</text>
    <circle cx="500" cy="215" r="31" fill="#F8F6EC" class="node"/><text x="500" y="222">4</text>
    <circle cx="490" cy="420" r="31" fill="#F8F6EC" class="node"/><text x="490" y="427">2</text>
    <circle cx="350" cy="455" r="31" fill="#F8F6EC" class="node"/><text x="350" y="462">8</text>

    <circle cx="1050" cy="330" r="31" fill="#E7F7EA" class="node"/><text x="1050" y="337">0</text>
    <circle cx="980" cy="255" r="28" fill="#F8F6EC" class="node"/><text x="980" y="262">1</text>
    <circle cx="1130" cy="255" r="28" fill="#F8F6EC" class="node"/><text x="1130" y="262">2</text>
    <circle cx="960" cy="365" r="28" fill="#F8F6EC" class="node"/><text x="960" y="372">3</text>
    <circle cx="910" cy="215" r="31" fill="#F8F6EC" class="node"/><text x="910" y="222">4</text>
    <circle cx="935" cy="440" r="31" fill="#F8F6EC" class="node"/><text x="935" y="447">5</text>
    <circle cx="1200" cy="215" r="31" fill="#F8F6EC" class="node"/><text x="1200" y="222">6</text>
    <circle cx="1190" cy="420" r="31" fill="#F8F6EC" class="node"/><text x="1190" y="427">7</text>
    <circle cx="1050" cy="455" r="31" fill="#F8F6EC" class="node"/><text x="1050" y="462">8</text>
  </g>

  <path d="M620 330 H780" class="flow"/>
  <rect x="635" y="300" width="130" height="42" rx="7" fill="#F8F6EC"/>
  <text x="700" y="329" text-anchor="middle" class="sans label">BFS levels</text>
  </g>

  <text x="1050" y="575" text-anchor="middle" class="sans body">root ID 0 -&gt; level 1 IDs 1-3 -&gt; level 2 IDs 4-8</text>
</svg>
