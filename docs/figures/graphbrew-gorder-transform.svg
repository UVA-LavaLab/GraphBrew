<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="535" viewBox="0 0 1200 535" role="img" aria-labelledby="title desc" fill="#27313A">
  <title id="title">Stage 4A: relaxed local Gorder orders the small C1 block</title>
  <desc id="desc">The production intra_gorder is a direct-neighbor UnitHeap heuristic, not faithful standalone GORDER_csr.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 Z" fill="#1769C2"/>
    </marker>
    <style>
      :root{color-scheme:light dark}
      @media(prefers-color-scheme:dark){
        [fill="#27313A"]{fill:#ECE7DD}[stroke="#27313A"]{stroke:#ECE7DD}
        [fill="#FFFFFF"]{fill:#1E2327}[fill="#F8F6EC"]{fill:#252A2E}
        [fill="#EDF5FF"]{fill:#273846}[fill="#E7F7EA"]{fill:#24382A}
        [fill="#FFF0D8"]{fill:#3B3122}[fill="#F7DEDC"]{fill:#3D292A}
        [fill="#EEE9FF"]{fill:#302C3C}[stroke="#9AA3AD"]{stroke:#747D86}
        [stroke="#1769C2"]{stroke:#63A8FF}[fill="#1769C2"]{fill:#63A8FF}
        .arrow{stroke:#63A8FF!important}.edge{stroke:#ECE7DD!important}
      }
      .sans{font-family:Arial,Helvetica,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,monospace}
      .title{font-size:32px;font-weight:700}.subtitle{font-size:18px}
      .domain{font-size:16px;font-weight:700;letter-spacing:1.2px}.heading{font-size:22px;font-weight:700}
      .label{font-size:18px;font-weight:700}.body{font-size:17px}.small{font-size:16px}
      .arrow{fill:none;stroke:#1769C2;stroke-width:3;marker-end:url(#arrow)}
      .edge{stroke:#27313A;stroke-width:2.2}
    </style>
  </defs>
  <rect width="1200" height="535" fill="#FFFFFF"/>
  <text x="42" y="47" class="sans title">Stage 4A: relaxed local Gorder orders the small C1 block</text>
  <text x="42" y="75" class="sans subtitle">Branch detail switches the highlight to v8 because tracked v2 is in C0; gw8 changes only C1 local IDs.</text>
  <line x1="42" y1="99" x2="1158" y2="99" stroke="#27313A" stroke-width="2"/>
  <rect x="35" y="120" width="500" height="330" rx="10" fill="#FFF0D8" stroke="#27313A" stroke-width="3"/>
  <text x="60" y="155" class="sans heading">Before local layout</text>
  <line x1="285" y1="155" x2="390" y2="260" class="edge"/>
  <line x1="285" y1="155" x2="285" y2="365" class="edge"/>
  <line x1="390" y1="260" x2="180" y2="260" class="edge"/>
  <line x1="285" y1="365" x2="180" y2="260" class="edge"/>
  <circle cx="285" cy="155" r="20" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/>
  <text x="285" y="160" class="sans label" text-anchor="middle">0</text>
  <circle cx="390" cy="260" r="20" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/>
  <text x="390" y="265" class="sans label" text-anchor="middle">3</text>
  <circle cx="285" cy="365" r="20" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/>
  <text x="285" y="370" class="sans label" text-anchor="middle">5</text>
  <circle cx="180" cy="260" r="23" fill="#E7F7EA" stroke="#1769C2" stroke-width="3"/>
  <text x="180" y="265" class="sans label" text-anchor="middle">8</text>
  <rect x="60.00" y="390" width="112.50" height="42" fill="#FFF0D8" stroke="#27313A" stroke-width="1.5"/>
  <text x="116" y="416" class="mono small" text-anchor="middle">v0</text>
  <rect x="172.50" y="390" width="112.50" height="42" fill="#FFF0D8" stroke="#27313A" stroke-width="1.5"/>
  <text x="228" y="416" class="mono small" text-anchor="middle">v3</text>
  <rect x="285.00" y="390" width="112.50" height="42" fill="#FFF0D8" stroke="#27313A" stroke-width="1.5"/>
  <text x="341" y="416" class="mono small" text-anchor="middle">v5</text>
  <rect x="397.50" y="390" width="112.50" height="42" fill="#FFF0D8" stroke="#27313A" stroke-width="1.5"/>
  <text x="453" y="416" class="mono small" text-anchor="middle">v8</text>
  <rect x="665" y="120" width="500" height="330" rx="10" fill="#EEE9FF" stroke="#27313A" stroke-width="3"/>
  <circle cx="695" cy="150" r="17" fill="#27313A" stroke="#27313A" stroke-width="1"/>
  <text x="695" y="156" class="sans label" text-anchor="middle" fill="#FFFFFF">4A</text>
  <text x="735" y="157" class="sans heading">After relaxed intra_gorder</text>
  <line x1="915" y1="155" x2="1020" y2="260" class="edge"/>
  <line x1="915" y1="155" x2="915" y2="365" class="edge"/>
  <line x1="1020" y1="260" x2="810" y2="260" class="edge"/>
  <line x1="915" y1="365" x2="810" y2="260" class="edge"/>
  <circle cx="915" cy="155" r="20" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/>
  <text x="915" y="160" class="sans label" text-anchor="middle">2</text>
  <circle cx="1020" cy="260" r="20" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/>
  <text x="1020" y="265" class="sans label" text-anchor="middle">3</text>
  <circle cx="915" cy="365" r="20" fill="#FFF0D8" stroke="#27313A" stroke-width="2"/>
  <text x="915" y="370" class="sans label" text-anchor="middle">1</text>
  <circle cx="810" cy="260" r="23" fill="#E7F7EA" stroke="#1769C2" stroke-width="3"/>
  <text x="810" y="265" class="sans label" text-anchor="middle">0</text>
  <rect x="690.00" y="390" width="112.50" height="42" fill="#FFF0D8" stroke="#1769C2" stroke-width="3"/>
  <text x="746" y="416" class="mono small" text-anchor="middle">v8</text>
  <rect x="802.50" y="390" width="112.50" height="42" fill="#FFF0D8" stroke="#27313A" stroke-width="1.5"/>
  <text x="858" y="416" class="mono small" text-anchor="middle">v5</text>
  <rect x="915.00" y="390" width="112.50" height="42" fill="#FFF0D8" stroke="#27313A" stroke-width="1.5"/>
  <text x="971" y="416" class="mono small" text-anchor="middle">v0</text>
  <rect x="1027.50" y="390" width="112.50" height="42" fill="#FFF0D8" stroke="#27313A" stroke-width="1.5"/>
  <text x="1083" y="416" class="mono small" text-anchor="middle">v3</text>
  <path d="M535 290 H661" class="arrow"/>
  <rect x="144" y="475" width="912" height="44" rx="9" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="600" y="502" class="sans small" text-anchor="middle">Invariant: C1 remains IDs 5..8 globally; only its four local positions change.</text>
</svg>
