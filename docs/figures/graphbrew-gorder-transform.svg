<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc" fill="#27313A">
  <title id="title">Gorder8 intra-community transformation</title>
  <desc id="desc">A small community keeps the same edges and block boundary while its local vertex IDs are reassigned to place vertices with overlapping neighborhoods close in the output order.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="9" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 Z" fill="#1769C2"/>
    </marker>
    <style>
      :root{color-scheme:light dark}
      @media(prefers-color-scheme:dark){
        [fill="#27313A"]{fill:#ECE7DD}[stroke="#27313A"]{stroke:#ECE7DD}
        [fill="#FFFFFF"]{fill:#1E2327}
        [fill="#F8F6EC"]{fill:#252A2E}[fill="#EDF5FF"]{fill:#273846}
        [fill="#E7F7EA"]{fill:#24382A}[fill="#FFF0D8"]{fill:#3B3122}
        [fill="#F7DEDC"]{fill:#3D292A}[fill="#EEE9FF"]{fill:#302C3C}
        [stroke="#9AA3AD"]{stroke:#747D86}
      }
      .sans{font-family:Arial,Helvetica,sans-serif}
      .title{font-size:44px;font-weight:700}.subtitle{font-size:24px}
      .domain{font-size:21px;font-weight:700;letter-spacing:1.3px}
      .heading{font-size:31px;font-weight:700}.body{font-size:24px}
      .label{font-size:22px;font-weight:700}
      .edge{stroke:#747D86;stroke-width:3.5}
      .node{stroke:#27313A;stroke-width:2.5}
      .flow{fill:none;stroke:#1769C2;stroke-width:3;marker-end:url(#arrow)}
          .graph-panel{stroke:#9AA3AD;stroke-width:2}
    </style>
  </defs>
  <rect width="1400" height="650" fill="#FFFFFF"/>

  <text x="45" y="55" class="sans title">3. Gorder8: reorder vertices inside a small community</text>
  <text x="45" y="88" class="sans subtitle">The community block stays fixed; only local IDs change.</text>
  <line x1="45" y1="112" x2="1355" y2="112" stroke="#27313A" stroke-width="2"/>

  <rect x="35" y="135" width="1330" height="490" rx="12" fill="none" stroke="#9AA3AD" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="52" y="162" class="sans domain">INTRA-COMMUNITY TRANSFORMATION</text>
  <text x="350" y="195" text-anchor="middle" class="sans heading">Before local ordering</text>
  <text x="1050" y="195" text-anchor="middle" class="sans heading">After Gorder8</text>
  <rect x="145" y="205" width="410" height="340" rx="12" fill="#F8F6EC" class="graph-panel"/>
  <rect x="845" y="205" width="410" height="340" rx="12" fill="#EDF5FF" class="graph-panel"/>

  <g transform="translate(0 45)">
  <circle cx="350" cy="330" r="150" fill="#FFF0D8" stroke="#9AA3AD" stroke-width="2" stroke-dasharray="7 6"/>
  <circle cx="1050" cy="330" r="150" fill="#FFF0D8" stroke="#9AA3AD" stroke-width="2" stroke-dasharray="7 6"/>
  <g class="edge">
    <line x1="270" y1="265" x2="350" y2="225"/><line x1="270" y1="265" x2="280" y2="375"/>
    <line x1="350" y1="225" x2="430" y2="270"/><line x1="350" y1="225" x2="355" y2="335"/>
    <line x1="280" y1="375" x2="355" y2="335"/><line x1="355" y1="335" x2="430" y2="270"/>
    <line x1="355" y1="335" x2="435" y2="390"/>
    <line x1="970" y1="265" x2="1050" y2="225"/><line x1="970" y1="265" x2="980" y2="375"/>
    <line x1="1050" y1="225" x2="1130" y2="270"/><line x1="1050" y1="225" x2="1055" y2="335"/>
    <line x1="980" y1="375" x2="1055" y2="335"/><line x1="1055" y1="335" x2="1130" y2="270"/>
    <line x1="1055" y1="335" x2="1135" y2="390"/>
  </g>
  <g class="sans body" text-anchor="middle">
    <circle cx="270" cy="265" r="28" fill="#F8F6EC" class="node"/><text x="270" y="272">4</text>
    <circle cx="350" cy="225" r="28" fill="#F8F6EC" class="node"/><text x="350" y="232">1</text>
    <circle cx="430" cy="270" r="28" fill="#F8F6EC" class="node"/><text x="430" y="277">5</text>
    <circle cx="280" cy="375" r="28" fill="#F8F6EC" class="node"/><text x="280" y="382">0</text>
    <circle cx="355" cy="335" r="30" fill="#F7DEDC" class="node"/><text x="355" y="342">3</text>
    <circle cx="435" cy="390" r="28" fill="#F8F6EC" class="node"/><text x="435" y="397">2</text>

    <circle cx="970" cy="265" r="28" fill="#F8F6EC" class="node"/><text x="970" y="272">1</text>
    <circle cx="1050" cy="225" r="28" fill="#F8F6EC" class="node"/><text x="1050" y="232">2</text>
    <circle cx="1130" cy="270" r="28" fill="#F8F6EC" class="node"/><text x="1130" y="277">3</text>
    <circle cx="980" cy="375" r="28" fill="#F8F6EC" class="node"/><text x="980" y="382">4</text>
    <circle cx="1055" cy="335" r="30" fill="#F7DEDC" class="node"/><text x="1055" y="342">0</text>
    <circle cx="1135" cy="390" r="28" fill="#F8F6EC" class="node"/><text x="1135" y="397">5</text>
  </g>

  <path d="M620 330 H780" class="flow"/>
  <rect x="625" y="286" width="150" height="72" rx="8" fill="#F8F6EC"/>
  <text x="700" y="315" text-anchor="middle" class="sans label">maximize overlap</text>
  <text x="700" y="343" text-anchor="middle" class="sans label">within window 8</text>
  </g>

  <rect x="120" y="535" width="1160" height="65" rx="8" fill="#F8F6EC" stroke="#27313A" stroke-width="2"/>
  <text x="700" y="575" text-anchor="middle" class="sans body">Vertices with shared recent neighbors receive nearby local IDs; edges and block range stay fixed.</text>
</svg>
